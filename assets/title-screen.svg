<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Saltmarrow Deep — The Sunken Ruin</title><desc id="d">A dark teal flooded temple, ruined arches, a colossal statue and kraken tentacles, with an adventurer's amber torch against bioluminescent cavern light.</desc>
