<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A gothic roguelike: descend beneath Saltmarrow, ring the bells, survive the Dread.">
<title>Saltmarrow Deep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&family=Spline+Sans+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one dungeon screen. Map with HUD overlays + hotbar on the left, hero sheet / satchel / log on the right; stacks on phones. Single dark world by design. */
:root{
  --abyss:#090d10; --hull:#10171a; --hull-2:#162024; --hull-3:#1d2a2f; --line:#26363a;
  --bone:#e2d9c6; --dim:#8a978f; --verdigris:#6fb5a0; --lantern:#e3a548; --rust:#c2533e; --violet:#b9a0e8; --sky:#7fb0e0;
  --display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --mono:"Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --prose:"IM Fell English", "Iowan Old Style", Georgia, serif; --dread:#9a6ad8;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--abyss);color:var(--bone)}
body{font-family:var(--mono);font-size:13px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--lantern);outline-offset:1px}
.wrap{max-width:1240px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--lantern)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){.hbtns .btn{padding:6px 8px;font-size:11.5px}}
.btn{background:var(--hull-2);border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:7px 12px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--verdigris)}
.btn.primary{border-color:var(--lantern);color:var(--lantern)}
.btn.primary:hover:not(:disabled){background:#2a2414}
.btn:disabled{opacity:.4;cursor:default}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:860px){.game{grid-template-columns:minmax(0,1fr)}}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;min-width:0;background:#040a0b;border:1px solid var(--line);border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;touch-action:manipulation;image-rendering:pixelated;cursor:default}
/* HUD on the map */
.hud-tl{position:absolute;top:8px;left:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chip{background:rgba(9,13,16,.82);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.chip b{color:var(--lantern);font-weight:500}
.chip.warn{color:var(--lantern)}.chip.bad{color:#e88a74}.chip.good{color:var(--verdigris)}
.tracker{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;max-width:calc(100% - 16px)}
.tracker .rnd{font-size:11.5px}
.tracker .rnd .foe{color:#e88a74}
.order{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tok{width:30px;background:rgba(9,13,16,.85);border:1px solid var(--line);border-radius:4px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tok img{width:24px;height:24px;image-rendering:pixelated}
.tok i{display:block;height:3px;width:100%;background:#2a0c08;border-radius:2px;overflow:hidden}
.tok i b{display:block;height:100%;background:var(--rust)}
.tok.hero{border-color:var(--verdigris)}.tok.hero i b{background:var(--verdigris)}
.tok.now{box-shadow:0 0 0 2px var(--lantern)}
.tok.dim{opacity:.4}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:toast 2.2s ease forwards}
.toast h3{font-family:var(--display);font-size:clamp(30px,6vw,46px);margin:0;line-height:1;color:var(--lantern);text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,.8)}
.toast p{margin:4px 0 0;color:var(--bone);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 0 #000}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none;opacity:0}}
.tip{position:absolute;pointer-events:none;background:rgba(9,13,16,.94);border:1px solid var(--line);border-radius:5px;padding:5px 9px;font-size:11.5px;max-width:240px;z-index:3;line-height:1.45}
.tip b{font-weight:500;color:var(--bone)}
.tip .s{color:var(--dim)}
.tip .t{color:var(--violet)}
.inspect{position:absolute;z-index:4;width:min(300px,calc(100% - 16px));background:var(--hull);border:1px solid var(--lantern);border-radius:8px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
.inspect .hd{display:flex;gap:10px;align-items:center}
.inspect .hd img{width:40px;height:40px;image-rendering:pixelated;background:#0a1214;border-radius:4px;flex:none}
.inspect h4{margin:0;font-family:var(--display);font-size:22px;line-height:1;color:var(--lantern);font-weight:700}
.inspect .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.inspect p{margin:0;font-size:12px;line-height:1.55}
.inspect .stats{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.inspect .stats span{color:var(--dim)}
.inspect .acts{display:flex;flex-direction:column;gap:4px}
.inspect .acts .btn{text-align:left}
.inspect .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,10,.9);padding:16px;overflow:auto;z-index:50}
@media (max-width:860px){.overlay{position:fixed;align-items:flex-start;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(5,8,10,.97);z-index:50}}
@media (max-width:620px){.tracker{top:36px}}
/* hotbar */
.bar{background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;min-height:32px}
.econ{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid currentColor;display:flex;gap:5px;align-items:center}
.pip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pip.move{color:var(--sky)}.pip.man{color:var(--verdigris)}.pip.main{color:var(--lantern)}
.pip.used{color:#3a4a4e}.pip.used::before{background:transparent;border:1px solid currentColor}
.res{font-size:11.5px;color:var(--lantern)}
.prompt{font-size:12px;color:var(--bone);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prompt b{color:var(--lantern);font-weight:500}
.prompt .s{color:var(--dim)}
.slots{display:flex;gap:6px;flex-wrap:wrap;row-gap:6px}
@media (max-width:620px){.slots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}}
.grp{display:flex;gap:4px;padding-right:6px;border-right:1px solid var(--line);flex:none;flex-wrap:wrap}
.grp:last-child{border-right:none}
.sl{position:relative;width:58px;height:60px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--hull-2);border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:4px 2px 3px;touch-action:manipulation}
.sl::before{content:"";position:absolute;left:6px;right:6px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--c,transparent)}
.sl.main{--c:var(--lantern)}.sl.man{--c:var(--verdigris)}.sl.move{--c:var(--sky)}
.sl:hover:not(:disabled){border-color:var(--c,var(--verdigris));background:var(--hull-3)}
.sl.sel{border-color:var(--lantern);background:#2a2414}
.sl:disabled{opacity:.33;cursor:default}
.sl img{width:24px;height:24px;image-rendering:pixelated}
.sl .nm{font-size:9.5px;line-height:1.1;text-align:center;color:var(--bone);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .k{position:absolute;top:3px;left:4px;font-size:9.5px;color:var(--dim)}
.sl .q{position:absolute;top:2px;right:4px;font-size:10px;color:var(--lantern);font-weight:700}
.sl .q.n{color:var(--bone)}
.endturn{font-size:13px;padding:8px 16px}
/* side panel */
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:12px}
.label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.who{display:flex;gap:10px;align-items:center}
.who img{width:44px;height:44px;image-rendering:pixelated;background:#0a1214;border-radius:6px;flex:none}
.who h2{font-family:var(--display);font-size:24px;line-height:1;margin:0;color:var(--lantern);font-weight:700}
.who .s{font-size:11px;color:var(--dim)}
.bar2{position:relative;height:10px;background:#06100f;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--rust);transition:width .25s}
.bar2 .wind{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--bone);opacity:.45}
.bar2.xp{height:5px}.bar2.xp i{background:var(--violet)}
.row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;font-size:12.5px}
.row b{font-weight:500}
.row span{color:var(--dim)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--verdigris);display:inline-block}
.dots i.off{background:#1f3633}
.dots.res i{background:var(--lantern);border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center}
.chars div{background:var(--hull-2);border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums;font-size:12px}
.chars small{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.08em}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.stat{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--violet)}
.stat.good{color:var(--verdigris)}.stat.warn{color:var(--lantern)}.stat.bad{color:#e88a74}.stat.dim{color:var(--dim)}
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.it{box-sizing:border-box;display:flex;align-items:center;gap:6px;background:var(--hull-2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px;cursor:pointer;text-align:left;width:100%}
.it:hover:not(:disabled){border-color:var(--verdigris)}
.it:disabled{opacity:.4;cursor:default}
.it img{width:24px;height:24px;image-rendering:pixelated;flex:none}
.it b{margin-left:auto}
.it.coin{cursor:default}
.trink{margin-top:8px;display:grid;gap:2px;font-size:11.5px}
.trink b{color:var(--lantern);font-weight:500}
.log{display:flex;flex-direction:column;gap:3px;height:13em;overflow-y:auto;font-size:12px;padding-right:4px;scrollbar-width:thin}
.log p{margin:0;flex:none}
.log p.old{opacity:.6}
.log p.bad{color:#e88a74}.log p.good{color:var(--verdigris)}.log p.gold{color:var(--lantern)}.log p.roll{color:var(--violet)}
.controls{display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:860px),(pointer:coarse){.controls{display:flex}}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px}
.pad button{background:var(--hull-2);border:1px solid var(--line);border-radius:6px;font-size:18px;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--line)}
.pad .mid{font-size:11px;color:var(--dim)}
.help-tip{font-size:11.5px;color:var(--dim);max-width:28ch;line-height:1.55}
/* tutorial tip */
.tipcard{position:absolute;left:10px;bottom:10px;max-width:min(380px,calc(100% - 20px));background:rgba(16,23,26,.95);border:1px solid var(--lantern);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tipcard p{margin:0;font-family:var(--prose);font-size:15px;line-height:1.5}
.tipcard .row{align-items:center}
.log p.guide{color:var(--lantern);font-style:italic}
textarea.code{width:100%;min-height:90px;background:var(--hull-2);color:var(--bone);border:1px solid var(--line);border-radius:6px;font:11px var(--mono);padding:8px;resize:vertical}
/* modals */
.mdl{width:100%;max-width:680px;background:var(--hull);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mdl.wide{max-width:900px}
.mhd{display:flex;gap:12px;align-items:center}
.mhd img{width:56px;height:56px;image-rendering:pixelated;background:#0a1214;border-radius:6px;flex:none}
.mhd h2{font-family:var(--display);font-size:30px;margin:0;line-height:1;color:var(--lantern);font-weight:700}
.mhd .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mhd .x{margin-left:auto}
.say{font-family:var(--prose);font-size:17px;line-height:1.6;color:var(--bone);margin:0;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:13px;padding:9px 12px}
.opts .btn::before{content:"› ";color:var(--lantern)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .btn.on{border-color:var(--lantern);color:var(--lantern)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;max-height:min(52vh,460px);overflow-y:auto;padding-right:4px}
.itm{background:var(--hull-2);border:1px solid var(--line);border-radius:7px;padding:9px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;min-width:0}
.itm .t{display:flex;gap:8px;align-items:center}
.itm .t img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.itm .t b{font-weight:500;font-size:12.5px;line-height:1.25}
.itm .r{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.itm ul{margin:0;padding-left:14px;color:var(--dim);line-height:1.5}
.itm ul li.cur{color:#e88a74}
.itm .row2{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:auto;flex-wrap:wrap}
.itm .pr{color:var(--lantern);font-variant-numeric:tabular-nums}
.itm.eq{border-color:var(--verdigris)}
.itm.lock{opacity:.5}
.purse{font-size:12px;color:var(--dim)}.purse b{color:var(--lantern);font-weight:500}
.sect{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:2px 0 -4px}
.lore{font-family:var(--prose);font-size:15px;line-height:1.6}
.lore h4{font-family:var(--display);font-size:18px;color:var(--lantern);margin:0 0 2px;font-weight:700}
.lore p{margin:0 0 10px}
.qst{display:flex;flex-direction:column;gap:2px;font-size:12.5px;padding:8px 10px;background:var(--hull-2);border-radius:6px}
.qst b{color:var(--lantern);font-weight:500}.qst .dn{color:var(--verdigris)}.qst .td{color:var(--dim)}
.bar2.dread{height:6px}.bar2.dread i{background:var(--dread)!important}
.epi{font-family:var(--prose);font-size:17px;line-height:1.7;max-width:60ch;margin:0}
.log p.dread{color:var(--dread)}.log p.whisper{color:#8a6aa8;font-style:italic;font-family:var(--prose);font-size:13.5px}
/* overlays */
.card{max-width:440px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.card h2{font-family:var(--display);font-size:40px;margin:0;line-height:1;color:var(--lantern);text-wrap:balance}
.card p{margin:0;color:var(--dim)}
.picker{width:100%;max-width:880px;display:flex;flex-direction:column;gap:12px;align-items:center}
.picker h2{font-family:var(--display);font-size:36px;margin:0;color:var(--lantern);line-height:1}
.picker>p{margin:0;color:var(--dim);text-align:center;max-width:62ch}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;width:100%}
.cls{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;cursor:pointer}
.cls:hover{border-color:var(--lantern)}
.cls .top{display:flex;gap:10px;align-items:center}
.cls img{width:48px;height:48px;image-rendering:pixelated;background:#0a1214;border-radius:4px}
.cls h3{font-family:var(--display);font-size:24px;margin:0;line-height:1;color:var(--lantern);font-weight:700}
.cls .role{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.cls p{margin:0;line-height:1.5}
.cls .st{color:var(--dim)}
.cls .pass{color:var(--verdigris)}
.help{max-width:720px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.help h2{font-family:var(--display);font-size:34px;margin:0;color:var(--lantern);line-height:1}
.help .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.help section{background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:12px}
.help h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:12px}
.help dt{color:var(--lantern)}
.help dd{margin:0}
.help p{margin:0 0 6px;font-size:12px;line-height:1.6}

/* ---------- phone layout (body.mob) ---------- */
body:not(.mob) .mobonly{display:none!important}
body.mob .deskonly{display:none!important}
body.mob{margin:0;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
body.mob .wrap{max-width:none;height:100dvh;padding:0;gap:0}
body.mob header{flex-wrap:nowrap;padding:max(6px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--hull);border-bottom:1px solid var(--line)}
body.mob h1{font-size:24px}
body.mob .hbtns{display:none;position:fixed;z-index:40;top:calc(max(6px,env(safe-area-inset-top,0px)) + 44px);right:8px;left:8px;grid-template-columns:1fr 1fr;gap:8px;background:var(--hull);border:1px solid var(--lantern);border-radius:10px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
body.mob .hbtns.open{display:grid}
body.mob .hbtns .btn{padding:12px 10px;font-size:13px}
body.mob .game{display:flex;flex-direction:column;flex:1;min-height:0;gap:0;align-items:stretch}
body.mob .left{flex:1;min-height:0;gap:0}
body.mob .stage{flex:1;min-height:0;border-radius:0;border-left:none;border-right:none;border-top:none}
body.mob #cv{position:absolute;inset:0;touch-action:none}
body.mob .bar{border-radius:0;border-left:none;border-right:none;border-bottom:none;padding:6px 8px;gap:6px}

function stepCost(t,e,ni){
  if(t===WALL||t===CRACK||t===GATE)return Infinity;
  const M=isP(e)?null:MT(e);
  if(t===PIT)return(M&&M.fly)?1:Infinity;
  let c=1;
  if(t===WATER){if(!M)c=2;else if(M.noSwim)return Infinity;else c=(M.swim||M.fly)?1:2}
  else if(M&&M.aquatic)return Infinity;
  if(t===WEB&&M&&!M.webwalk&&!M.fly)c+=2;
  if(M&&ni!=null){if(S.L.fire[ni]>0)c+=6;if(S.L.spore[ni]>0&&!M.sporeproof)c+=3}
  return c}

function los(x0,y0,x1,y1,noSmoke){
  let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx+dy,x=x0,y=y0;
  for(;;){if(x===x1&&y===y1)return true;
    if(!(x===x0&&y===y0)){const i=I(x,y);if(opaqueAt(i))return false;if(!noSmoke&&(S.L.smoke[i]>0||S.L.spore[i]>0))return false}
    const e2=2*err;if(e2>=dy){err+=dy;x+=sx}if(e2<=dx){err+=dx;y+=sy}}}
const sees=(ax,ay,bx,by)=>los(ax,ay,bx,by)||los(bx,by,ax,ay);
function paths(e,sx,sy,max,opt){opt=opt||{};
  const dist=new Float32Array(W*H).fill(Infinity),prev=new Int32Array(W*H).fill(-1),B=[];const s=I(sx,sy);dist[s]=0;B[0]=[s];
  for(let c=0;c<=max;c++){const b=B[c];if(!b)continue;
    for(let k=0;k<b.length;k++){const n=b[k];if(dist[n]!==c)continue;const x=n%W,y=(n/W)|0;
      for(const[dx,dy]of DIR8){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const ni=I(nx,ny);
        const cost=stepCost(S.L.map[ni],e,ni);if(cost===Infinity)continue;
        if(ni!==opt.goal&&(opt.ignoreMons?!!blockObjAt(nx,ny):occupied(nx,ny,e)))continue;
        const nd=c+cost;if(nd>max||nd>=dist[ni])continue;dist[ni]=nd;prev[ni]=n;(B[nd]||(B[nd]=[])).push(ni)}}}
  return{dist,prev}}
function pathTo(pr,goal){if(pr.dist[goal]===Infinity)return null;const out=[];let n=goal;while(pr.prev[n]!==-1){out.push(n);n=pr.prev[n]}return out.reverse()}
function bfsDist(sx,sy,gatesOpen){const d=new Int32Array(W*H).fill(-1),q=[I(sx,sy)];d[q[0]]=0;const blk=new Uint8Array(W*H);
  if(S.L.objs)for(const o of S.L.objs)if(FEAT[o.type].block)blk[I(o.x,o.y)]=1;
  for(let h=0;h<q.length;h++){const n=q[h],x=n%W,y=(n/W)|0;for(const[dx,dy]of DIR8){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const ni=I(nx,ny),t=S.L.map[ni];
    if(t===WALL||t===CRACK||t===PIT||(t===GATE&&!gatesOpen)||d[ni]>=0||blk[ni])continue;d[ni]=d[n]+1;q.push(ni)}}return d}
function rebuildOpq(){const L=S.L;L.opq=new Uint8Array(W*H);for(const o of L.objs)if(FEAT[o.type].opaque)L.opq[I(o.x,o.y)]=1}

function rollRarity(d,luck){const r=Math.random()*100-(luck||0);const e=4+d*2,s=12+d*2,f=34;if(r<e)return'eldritch';if(r<e+s)return'storied';if(r<e+s+f)return'fine';return'worn'}
function genWeapon(d,rar,base){rar=rar||rollRarity(d);base=base||pick(Object.keys(WBASE));const R=RARITY[rar];let budget=R.b+Math.floor(d/2);
  const it={id:'i'+Math.random().toString(36).slice(2,9),kind:'weapon',base,rar,aff:{},curse:null,ident:rar==='worn',d};
  if(rar==='eldritch'||(rar!=='worn'&&Math.random()<0.18)){const c=pick(Object.keys(CURSE));it.curse=c;budget+=CURSE[c].w+(rar==='eldritch'?2:0)}
  let guard=0;while(budget>0&&guard++<40){const opts=Object.keys(AFFIX).filter(k=>(it.aff[k]||0)<AFFIX[k].max&&AFFIX[k].cost<=budget&&!(k==='el'&&WBASE[base].base.el));if(!opts.length)break;const k=pick(opts);it.aff[k]=(it.aff[k]||0)+1;budget-=AFFIX[k].cost;if(k==='el')it.el=pick(['fire','frost','lightning','void','holy'])}
  it.name=weaponName(it);it.value=itemValue(it);return it}
function weaponName(it){const B=WBASE[it.base],noun=pick(NOUNS[it.base]);const keys=Object.keys(it.aff).sort((a,b)=>it.aff[b]*AFFIX[b].cost-it.aff[a]*AFFIX[a].cost);const top=keys[0];
  if(it.rar==='worn')return`${pick(WORN)} ${B.name}`;
  if(it.rar==='fine')return`${B.name.replace(/^./,c=>c.toUpperCase())} ${top==='el'?'of '+it.el:SUFFIX[top]||''}`.trim();
  if(it.rar==='storied'){const o=pick(OWNERS);return`${o.replace(/^./,c=>c.toUpperCase())}'s ${noun}`}
  return`The ${noun} That ${pick(VERBS)}`}
function itemValue(it){if(it.kind==='tome')return 30+it.sp.cost*18+it.d*6+(it.rar==='eldritch'?40:0);let v=15+it.d*5;for(const k in it.aff)v+=it.aff[k]*AFFIX[k].cost*10;if(it.curse)v-=CURSE[it.curse].w*6;return Math.max(10,v)}

function genTome(d,rar){rar=rar||rollRarity(d);const sh=Math.random()<0.18?pick(['ward','blink']):pick(['bolt','bolt','area','burst']);const el=pick(Object.keys(ELEM));
  const cost=Math.max(1,Math.min(5,{worn:1,fine:2,storied:3,eldritch:4}[rar]+rnd(2)));const S0=SHAPES[sh];
  const sp={shape:sh,el,cost,act:S0.act,kind:S0.kind,range:S0.range,radius:S0.radius,rider:null,dread:rar==='eldritch'?2:el==='void'?1:0};
  if(S0.mul){let d2=S0.base+cost*S0.mul+Math.floor(d/3);if(rar==='eldritch')d2*=1.35;const riders=['push','pull','daze','weaken','smoke',null];sp.rider=sh==='burst'&&Math.random()<0.5?'push':pick(riders);if(!sp.rider)d2+=1;if(sp.rider==='pull'&&sh!=='bolt')sp.rider='push';
    sp.t=[Math.max(1,Math.round(d2*0.55)),Math.round(d2),Math.round(d2*1.45)].map((v,i)=>{const t={d:v};if(sp.rider==='push'&&i>0)t.push=1+i;if(sp.rider==='pull'&&i>0)t.pull=1+i;if(sp.rider==='daze'&&i===2)t.cond='dazed';if(sp.rider==='weaken'&&i>0)t.cond='weakened';if(el==='frost'&&i>0&&!t.cond)t.cond='slowed';return t})}

  it.name=`${pick(TOME_N)} of ${pick(EL_WORDS[el])}`;sp.name=it.name.replace(/^(\w+) of /,(m,a)=>a+' of ');it.value=itemValue(it);return it}

  if(sp.t){ab.t=sp.t;if(sp.el==='lightning')ab.lightning=true;if(sp.rider==='smoke')ab.smoke=true}if(sp.shape==='ward'){ab.ward=sp.amt}if(sp.shape==='blink'){ab.blink=true}

  if(S.bless&&S.bless[k])v+=S.bless[k];if(S.kitEff&&S.kitEff[k])v+=S.kitEff[k];if(S.gear&&S.gear.relic){const e=RELICS[S.gear.relic.r].eff;if(e[k])v+=e[k]}return v}

const WHISPERS=['Someone is breathing just behind you.','You hear your name, spoken from inside the wall.','The salt tastes of tears.','Something in the dark is counting your steps.','She is dreaming of you.','Your lantern flame bends toward the deep.','A child is singing a hymn, very far below.','You remember drowning. You have never drowned.','The walls are wet and warm.','Do not look at the water.','It knows the shape of your face now.','Footsteps stop when yours do.'];
function addDread(n,why){if(!S||!S.P||!S.L||S.L.town||n<=0)return;const P=S.P;
  if((gearSum('steady')||(S.bless&&S.bless.steady))&&Math.random()<0.4)n--;if(S.cls==='flag'&&litAt(P.x,P.y))n=Math.floor(n/2);if(n<=0)return;
  if(relic('finger'))n++;const was=P.dread||0;P.dread=Math.min(10,was+n);if(why)log(why,'dread');
  if(was<4&&P.dread>=4)log('Your hands will not stop shaking.','dread');if(was<7&&P.dread>=7)log('The walls are breathing. Dread is clouding your judgement.','dread');
  if(P.dread>=10)snap()}
function easeDread(n,why){const P=S.P;if(!P.dread)return;P.dread=Math.max(0,P.dread-n);if(why)log(why,'good')}
function snap(){const P=S.P;const r=d10();P.dread=6;UI.fx('shake',{m:6});
  if(r>=8){log('Revelation. For a moment you see the shape of everything, and it is beautiful.','dread');P.insight=1;for(let dy=-10;dy<=10;dy++)for(let dx=-10;dx<=10;dx++){const x=P.x+dx,y=P.y+dy;if(inb(x,y))S.L.seen[I(x,y)]=1}UI.toast('Revelation','Your next attack tears with void');return}
  const k=rnd(4);UI.toast('Your mind breaks','Dread overwhelms you');
  if(k===0){log('You scream. You cannot stop screaming.','dread');noise(P.x,P.y,12)}
  else if(k===1){log('You drop your lantern and stamp out the light in a panic.','dread');P.lantern=false;computeFov()}
  else if(k===2){log('You claw at your own arms to make the whispering stop.','dread');damage(P,3,null)}
  else{log('You freeze, unable to move.','dread');if(S.C)addC(P,'dazed');else addC(P,'slowed')}}
function dreadBane(){return S.P.dread>=8?1:0}

function epilogue(id){const L=[];
  const head={break:["You put the Abbot down, and this time he stays down. Far below, something vast turns over in its sleep.","By spring the salt has stopped. By autumn the springs run fresh, then brackish, then cold and black. The sea is coming back to the valley, a hand's breadth every year.","Saltmarrow does not drown all at once. It takes a generation. But it is free, for whatever that is worth."],
    renew:["You take the crozier from his hand. It is warm. The water rises to your knees, your waist, your throat, and you find you do not need to breathe.","Up above, the salt flows again. The lottery is drawn each season. They call it the highest grace.","Sometimes a delver comes down with a lantern and a hopeful face. You let them get very close before you sing."],
    agathe:["Agathe walks into the black water without looking back. She is singing the psalm her great-grandmother wrote, and for the first time it sounds like a lullaby.","The Mother sleeps without dreaming. The salt is only salt now, and the seams run thin. Saltmarrow grows poor, and quiet, and safe.","Every night you hear her singing, very faintly, from the bottom of the shaft. You tell no one."],

  if(flag('pipFreed'))L.push(id==='break'||id==='agathe'||id==='hale'?'Pip went back down the shaft one night without a lamp. Tobias still leaves the forge door open for him.':'Pip sings at the forge now, the same hymn, over and over. Tobias has stopped asking him to stop.');

  if(flag('bribed'))L.push('The Mayor\'s silver bought you a fine house on the cliff. You sleep badly in it.');

/* ================= level generation ================= */
function genLevel(){
  const map=new Array(W*H).fill(WALL),reg=new Array(W*H).fill(-1),rooms=[];let nreg=0;const boss=S.depth===MAXD;const bio=biomeOf(S.depth);
  const carve=(x,y,r)=>{map[I(x,y)]=FLOOR;reg[I(x,y)]=r};const resv=new Uint8Array(W*H);
  const SHAPES={mine:['rect','rect','cave','round','octa','pillar','cave'],crypt:['rect','cross','octa','pillar','round','rect','pillar'],fungal:['cave','cave','round','cave','octa','rect'],drowned:['round','octa','pillar','rect','cross','cave']}[bio];
  const addRoom=(x,y,w,h,ex)=>{const r=nreg++;const shape=ex||w<7||h<5?'rect':pick(SHAPES);const cx=x+(w>>1),cy=y+(h>>1);
    const inShape=(i,j)=>{if(i===cx||j===cy)return true;const nx=(i-x+0.5)/w*2-1,ny=(j-y+0.5)/h*2-1;
      switch(shape){case'round':return nx*nx+ny*ny<=1.08;case'cave':return nx*nx+ny*ny<=0.78+Math.random()*0.5;case'cross':return Math.abs(nx)<0.5||Math.abs(ny)<0.5;
        case'octa':{const c=Math.max(1,Math.floor(Math.min(w,h)/3));const dx=Math.min(i-x,x+w-1-i),dy=Math.min(j-y,y+h-1-j);return dx+dy>=c}default:return true}};
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){resv[I(i,j)]=1;if(inShape(i,j))carve(i,j,r)}
    if(shape==='pillar')for(let j=y+1;j<y+h-1;j++)for(let i=x+1;i<x+w-1;i++)if((i-x)%3===1&&(j-y)%3===1&&i!==cx&&j!==cy){map[I(i,j)]=WALL;reg[I(i,j)]=-1}
    rooms.push(Object.assign({x,y,w,h,r,cx,cy,shape,cave:shape==='cave'},ex||{}))};
  const LW=boss?W:47,LH=boss?H:33;
  if(boss)addRoom(23,15,17,13,{chapel:true});
  for(let t=0;t<320&&rooms.length<(boss?11:10);t++){
    const w=rr(2,5)*2+1,h=rr(2,4)*2+1,x=rr(0,(LW-2-w)>>1)*2+1,y=rr(0,(LH-2-h)>>1)*2+1;
    if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;addRoom(x,y,w,h)}
  const straight={crypt:0.85,drowned:0.75,mine:0.6,fungal:0.4}[bio];
  for(let y=1;y<LH-1;y+=2)for(let x=1;x<LW-1;x+=2){if(map[I(x,y)]!==WALL||resv[I(x,y)])continue;const r=nreg++;carve(x,y,r);const st=[[x,y]];let last=null;
    while(st.length){const[cx,cy]=st[st.length-1];const opts=DIR4.filter(([dx,dy])=>{const nx=cx+dx*2,ny=cy+dy*2;return nx>0&&ny>0&&nx<LW-1&&ny<LH-1&&map[I(nx,ny)]===WALL&&!resv[I(nx,ny)]&&!resv[I(cx+dx,cy+dy)]});
      if(opts.length){const d=(last&&opts.includes(last)&&Math.random()<straight)?last:pick(opts);carve(cx+d[0],cy+d[1],r);carve(cx+d[0]*2,cy+d[1]*2,r);st.push([cx+d[0]*2,cy+d[1]*2]);last=d}else{st.pop();last=null}}}
  const roomReg=new Set(rooms.map(r=>r.r));const conns=[];
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(map[I(x,y)]!==WALL)continue;const rs=new Set();for(const[dx,dy]of DIR4){const g=reg[I(x+dx,y+dy)];if(g>=0)rs.add(g)}if(rs.size>=2)conns.push({x,y,rs:[...rs]})}
  const par=[...Array(nreg).keys()];const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a]}return a};
  const openC=c=>{map[I(c.x,c.y)]=c.rs.some(r=>roomReg.has(r))&&Math.random()<0.75?DOOR:FLOOR;reg[I(c.x,c.y)]=c.rs[0];c.done=true};
  for(;;){const live=conns.filter(c=>!c.done&&new Set(c.rs.map(find)).size>1);if(!live.length)break;const c=pick(live);openC(c);const r0=find(c.rs[0]);for(const r of c.rs)par[find(r)]=r0}
  for(const c of conns){if(c.done||Math.random()>0.13)continue;if(DIR8.some(([dx,dy])=>map[I(c.x+dx,c.y+dy)]===DOOR))continue;openC(c)}
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  for(let pass=0;pass<60;pass++){const kill=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=I(x,y);if((map[i]!==FLOOR&&map[i]!==DOOR)||inRoom(x,y))continue;let n=0;for(const[dx,dy]of DIR4)if(map[I(x+dx,y+dy)]!==WALL)n++;if(n<=1)kill.push(i)}if(!kill.length)break;kill.forEach(i=>map[i]=WALL)}
  // natural biomes: erode corridors into rough tunnels and small caverns (rooms keep their walls so gates still hold)

function carveSecret(opt){const L=S.L;const thick=opt.thick||2;

    const lineSet=new Set(line);let bad=false;for(const[x,y]of cells){for(let oy=-1;oy<=1&&!bad;oy++)for(let ox=-1;ox<=1;ox++){const j=I(x+ox,y+oy);if(lineSet.has(j))continue;if(L.map[j]!==WALL||L.objs.some(o=>o.x===x+ox&&o.y===y+oy)){bad=true;break}}if(bad)break}if(bad)continue;

function sealSecrets(){const L=S.L;if(!L.secrets)return;for(const sr of L.secrets){if(sr.found||sr.vault)continue;const cs=new Set(sr.cells);const leak=[];

  if(Math.random()<0.25){const p4=take();if(p4)L.objs.push({type:'shrine',x:p4[0],y:p4[1],id:S.nextId++})}
  if(Math.random()<0.4){const ln=LORE.findIndex((q,i)=>!META.lore[i]&&q.d<=S.depth);const p5=take();if(ln>=0&&p5)L.items.push({kind:'page',n:ln,x:p5[0],y:p5[1]})}}

  ov.innerHTML=`<div class="picker"><h2>Choose your delver</h2><p>The Saltmarrow mine broke into something older. Sneak past what lives below, bring the roof down on it, or fight it out on the grid. Every attack is a 2d10 power roll that lands in one of three tiers, so you never simply miss.</p>
    ${sv?`<button class="btn primary" id="contBtn">Continue · ${CLASSES[sv.cls].name}, depth ${sv.depth}</button>`:''}
    <div class="classes">${Object.entries(CLASSES).map(([k,c])=>`<button class="cls" data-cls="${k}"><div class="top"><img src="${ICON[c.spr]}" alt=""><div><h3>${c.name}</h3><div class="role">${c.role} · ${c.res}</div></div></div><p>${c.blurb}</p><p class="st">Stamina ${c.stam} · Speed ${c.speed} · Recoveries ${c.recov}</p><p class="pass">${c.passive}</p><p class="st">${c.abilities.map(a=>AB[a].name).join(' · ')}</p></button>`).join('')}</div>
    <button class="btn" id="pickHelp">How to play</button></div>`;

function showHelp(back){const ov=$('overlay');closeInspect();hideTip();
  ov.innerHTML=`<div class="help"><h2>How to play</h2><div class="cols">
    <section><h3>Mouse</h3><dl><dt>Left-click</dt><dd>Walk there, or attack an enemy</dd><dt>Right-click</dt><dd>Inspect anything: monsters, props, tiles. Shows what you can do with it.</dd><dt>Hover</dt><dd>Quick name, path preview, and damage forecast while aiming</dd><dt>Hotbar</dt><dd>Pick an ability, then click a highlighted target</dd></dl></section><section><h3>Touch</h3><dl><dt>Tap</dt><dd>Walk there, attack, or talk</dd><dt>Hold</dt><dd>Action menu: inspect it and see everything you can do with it</dd><dt>Drag</dt><dd>Look around the map</dd><dt>Pinch</dt><dd>Zoom in or out (also in Menu)</dd><dt>Abilities</dt><dd>Tap one, tap a highlighted square, then tap it again or press Use. Hold an ability to read it.</dd><dt>Dock</dt><dd>Hero, Pack and Log open sheets from the bottom. Tap the stamina chip on the map for your hero.</dd><dt>Menu</dt><dd>Pace, sound, save, zoom, and optional arrow buttons</dd></dl></section>
    <section><h3>Keys</h3><dl><dt>WASD · arrows</dt><dd>Move (QEZC diagonals)</dd><dt>1–5</dt><dd>Class abilities</dd><dt>6 7 8 9 0</dt><dd>Shift, shove, hide, defend, dash</dd><dt>R X V F</dt><dd>Draught, charge, smoke bomb, firepot</dd><dt>T · B · L</dt><dd>Toss stone, catch breath, lantern</dd><dt>Space</dt><dd>End turn (or wait)</dd><dt>Tab · Enter · Esc</dt><dd>Cycle, confirm, cancel targets</dd><dt>&gt;</dt><dd>Descend stairs</dd></dl></section>
    <section><h3>Combat</h3><p>Exploring happens in real time: enemies patrol and notice you on their own. The moment a fight starts, the game becomes turn-based until it ends. (You can switch exploring to turn-based in the menu.)</p><p>Each turn you get a <b>move</b>, a <b>maneuver</b> and a <b>main action</b>. Attacks roll 2d10 + a characteristic: 11 or less is tier 1, 12–16 tier 2, 17+ tier 3. Edges add 2, banes subtract 2; a double edge or bane shifts the tier. A natural 19–20 is a critical and gives you another main action.</p><p>Walking away from an adjacent enemy gives it a free strike. <b>Shift</b> to step away safely. Push foes into walls, carts, props, fire and shafts for extra damage.</p><p>Your heroic resource builds each turn. Winning fights adds <b>Victories</b>, which start you with more. Catch your breath with Recoveries.</p></section>
    <section><h3>Sneaking</h3><p>Attack an enemy that hasn't noticed you for a <b>sneak attack</b>: double damage (triple for the Cutpurse). Kill it outright and nobody else knows: no fight starts, and you earn half again the XP. If it survives, the fight begins with you acting first.</p><p>The bar over a suspicious enemy's head fills as it watches you. In shadow with your lantern shuttered it fills more slowly. The eye chip on the map tells you how exposed you are.</p><p>The Cutpurse can pick pockets (hold or right-click an unaware enemy next to you) and <b>Shadowstep</b> to an unlit square nearby.</p></section>
    <section><h3>Survival</h3><p><b>Fatigue</b> builds as you explore and fight. Weary (60+) gives a bane on your rolls; exhausted (85+) gives two and slows you.</p><p><b>Make camp</b> (K) once per level when nothing is hunting you. Strike a flint to light the fire, choose two things to do, then face whatever comes in the night. A bigger fire rests you better but draws attention. Rations make for a proper meal.</p><p>Between the mines, crypts, hollows and vaults lies a <b>long descent</b>: a journey of several legs, each resolved with a 2d10 test. Some levels have an old side passage that skips a level the hard way. What happens on the road follows you: failures bring trouble (something tracks you down, the braziers are cold, the level knows you are coming), triumphs bring help (a supply cache, the map scouted, an unseen arrival).</p><p>Search crates, lockers, urns, sacks, reliquaries, shelves, barrels and bodies by walking into them. Urns are loud to break, and some sacks have something living in them.</p></section>
    <section><h3>Living levels</h3><p>Most levels have a <b>situation</b> shown at the top of the map: a ritual to break (kill the celebrants or snuff the candles), a marked beast to hunt, a vault needing three keys, a flood to stop at its valve, or a cave-in to brace with the old jack.</p><p><b>Traps</b> hide on plates and tripwires. You may spot them as you pass (Intuition and an open lantern help; the Cutpurse spots most). Step around them, disarm them, or lure enemies across. <b>Rotten floors</b> give way a moment after something heavy steps on them.</p><p><b>Firedamp</b> pockets explode from any spark, <b>oil</b> burns in sheets, <b>chandeliers</b> come down on a thrown stone, <b>sluices</b> flood rooms, and <b>boulders</b> roll down long tunnels. Monster factions hate each other: make noise near rival groups and let them fight.</p><p><b>Secret rooms</b> hide behind thick walls. A cold draught, a knock on the wall (hold or right-click it) or a miner's note gives them away. Blast through with charges (one per layer of rock), dig with a pick, or solve the lever and brazier puzzles: their plaques give the order.</p><p>You will meet <b>people and things</b> down there. Choices are rolled like journeys.</p></section>
    <section><h3>Combat tells and growth</h3><p>On your turn, a badge over each enemy shows what it will do next and roughly how much it will hurt. A sapper that lights a fuse marks where the bomb will land, so get out of the squares.</p><p>Each level-up lets you choose one of three perks. At levels 2, 3 and 5 you also <b>learn a new move</b> from your class's pool: pick one of two. Learned moves sit at the end of your bar and fire with Shift+1, Shift+2 and Shift+3. <b>Explore</b> (O) walks you to the next unexplored spot and stops the moment anything stirs.</p></section>
    <section><h3>Stealth and the world</h3><p>Red cones show where enemies are looking. Your open lantern lets you see far but makes you easy to spot. Light from braziers and fires gives you away; tall growth, smoke and water hide you.</p><p>Toss stones to lure guards, shatter crystals for a big distraction, douse braziers to darken a room. Blast cracked walls and gates, bring timber props down on enemies, roll carts into them, burn webs and growth.</p><p>Wolves hunt in packs and surround you. Archers back away. Cultists heal their friends. Ghouls eat corpses. Learn them by inspecting.</p></section>
  </div><button class="btn primary" id="helpBack">Back</button></div>`;
  ov.hidden=false;$('helpBack').onclick=()=>{if(back)back();else ov.hidden=true}}

  const lost=carriedItems().length;ov.innerHTML=`<div class="card"><h2>The deep keeps you</h2><p class="say" style="text-align:center">${esc(`You fell at depth ${S.depth}, in ${BIOMES[S.L.bio].name.toLowerCase()}, to ${src?nameOf(src):'the dark'}.`)}</p><p>${S.gold} silver and ${lost} item${lost===1?'':'s'} are lost with you. What you left in your cottage is safe.</p><button class="btn primary" id="again">Wake in Saltmarrow</button></div>`;

UI.stopWalk=()=>{walkQ=null};

/* ---------- input ---------- */
let walkQ=null,walkTalk=null;
function startWalk(x,y){if(!S||S.busy||S.mode!=='explore')return;const P=S.P;const pr=paths(P,P.x,P.y,200);const p=pathTo(pr,I(x,y));if(!p||!p.length)return;walkQ=p;runWalk()}
async function runWalk(){while(walkQ&&walkQ.length&&S.mode==='explore'&&!S.over){const n=walkQ.shift();const x=n%W,y=(n/W)|0;const P=S.P;const before=S.L.mons.filter(monVisible).length;const sus0=S.L.mons.filter(m=>m.state!=='idle').length;
    if(cheb(x,y,P.x,P.y)!==1){walkQ=null;break}const ok=await exploreStep(x-P.x,y-P.y);if(!ok){walkQ=null;break}
    const after=S.L.mons.filter(monVisible).length,sus1=S.L.mons.filter(m=>m.state!=='idle').length;if(after>before||sus1>sus0){walkQ=null;log('You stop. Something stirs.','old');UI.render();break}
    if(window.RT_STOP){window.RT_STOP=false;walkQ=null;break}await new Promise(r=>setTimeout(r,window.RT&&RT.on?150:90))}walkQ=null;if(walkTalk){const k=walkTalk;walkTalk=null;const n=S.L.npcs&&S.L.npcs.find(n=>n.key===k&&cheb(n.x,n.y,S.P.x,S.P.y)<=1);if(n)UI.talk(k)}}
function tileFromEvent(ev){const r=cv.getBoundingClientRect();return{x:Math.floor(((ev.clientX-r.left)/ZOOM+camX)/T),y:Math.floor(((ev.clientY-r.top)/ZOOM+camY)/T)}}
function clickTile(x,y){if(!S||S.over||!$('overlay').hidden||!inb(x,y))return;
  if(!insp.hidden){closeInspect();return}
  if(SEL.id){if(isValid(x,y)||AB[SEL.id].kind==='burst')confirmSel(x,y);else cancelSel();return}
  if(S.busy)return;const P=S.P;
  if(S.mode==='combat'){if(S.C.phase!=='hero')return;const m=monAt(x,y);if(m&&monVisible(m)){const id=defaultAttack(x,y);if(id&&abUsable(id).ok){useAbility(id,x,y);return}}
    if(cheb(x,y,P.x,P.y)===1&&blockObjAt(x,y)){combatStep(x-P.x,y-P.y);return}
    if(x===P.x&&y===P.y)return;combatWalkTo(x,y);return}
  if(x===P.x&&y===P.y){exploreStep(0,0);return}
  if(cheb(x,y,P.x,P.y)===1){walkQ=null;exploreStep(x-P.x,y-P.y);return}
  if(S.L.npcs&&npcAt(x,y)){const a=nearestAdj(x,y);if(a){startWalk(a.x,a.y);walkTalk=npcAt(x,y).key}return}
  const m=monAt(x,y);if(m&&monVisible(m)){const id=defaultAttack(x,y);if(id&&AB[id].kind==='ranged'){useAbility(id,x,y);return}}
  if(!S.L.seen[I(x,y)])return;let tx=x,ty=y;if(blockObjAt(x,y)||(m&&monVisible(m))){const a=nearestAdj(x,y);if(!a)return;tx=a.x;ty=a.y}startWalk(tx,ty)}
cv.addEventListener('click',ev=>{const{x,y}=tileFromEvent(ev);clickTile(x,y)});
cv.addEventListener('contextmenu',ev=>{ev.preventDefault();if(!S||!S.L||!$('overlay').hidden)return;if(SEL.id){cancelSel();return}const{x,y}=tileFromEvent(ev);openInspect(x,y,ev.clientX,ev.clientY)});
let lastHover='';
cv.addEventListener('mousemove',ev=>{if(!S||!S.L)return;const t=tileFromEvent(ev);
  if(SEL.id){if(isValid(t.x,t.y)){SEL.cursor=t;const m=monAt(t.x,t.y);const f=m?forecast(SEL.id,t.x,t.y):'';if(f)showTip(f,ev.clientX,ev.clientY);else hideTip()}else hideTip();return}
  SEL.hover=t;const key=t.x+','+t.y;if(key!==lastHover){lastHover=key;SEL.walk=null;
    if(S.mode==='explore'&&inb(t.x,t.y)&&S.L.seen[I(t.x,t.y)]&&cheb(t.x,t.y,S.P.x,S.P.y)<=24&&!blockObjAt(t.x,t.y)){const pr=paths(S.P,S.P.x,S.P.y,40);SEL.walk=pathTo(pr,I(t.x,t.y))}}
  const s=insp.hidden?tileSummary(t.x,t.y):null;if(s)showTip(s,ev.clientX,ev.clientY);else hideTip()});
cv.addEventListener('mouseleave',()=>{SEL.hover=null;SEL.walk=null;lastHover='';hideTip()});
document.addEventListener('mousedown',ev=>{if(!insp.hidden&&!insp.contains(ev.target)&&ev.target!==cv)closeInspect()});
const MOVE={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],q:[-1,-1],e:[1,-1],z:[-1,1],c:[1,1],Home:[-1,-1],PageUp:[1,-1],End:[-1,1],PageDown:[1,1]};
function doMove(dx,dy){closeInspect();if(S.mode==='combat')combatStep(dx,dy);else{walkQ=null;exploreStep(dx,dy)}}
document.addEventListener('keydown',ev=>{if(AUTO.on&&ev.key!=='o'){AUTO.on=false}if(ev.metaKey||ev.ctrlKey||ev.altKey||!S||!S.L)return;
  const k=ev.key.length===1?ev.key.toLowerCase():ev.key;
  if(!$('overlay').hidden){if(k==='Escape'){if($('helpBack'))$('helpBack').click();else if(ov.querySelector('[data-close]'))closeModal()}return}
  if(menuOpen()){if(k==='Escape'||k==='m'){ev.preventDefault();toggleMenu(false)}return}
  if(k==='m'){toggleMenu(true);return}
  if(k==='j'){UI.journal();return}if(k==='g'){UI.gear();return}
  if(k==='?'){showHelp();return}
  if(k==='Escape'){if(!insp.hidden){closeInspect();return}if(SEL.id){cancelSel();return}toggleMenu(true);return}
  if(SEL.id){
    if(k==='Enter'||k===' '){ev.preventDefault();confirmSel();return}
    if(k==='Tab'){ev.preventDefault();const v=SEL.valid.filter(t=>monAt(t.x,t.y)||blockObjAt(t.x,t.y));const list=v.length?v:SEL.valid;const i=list.findIndex(t=>t.x===SEL.cursor.x&&t.y===SEL.cursor.y);SEL.cursor=list[(i+1)%list.length];UI.render();return}
    const d=MOVE[k];if(d){ev.preventDefault();const c=SEL.cursor||{x:S.P.x,y:S.P.y};SEL.cursor={x:c.x+d[0],y:c.y+d[1]};UI.render();return}}
  if(S.busy||S.over)return;
  const d=MOVE[k];if(d){ev.preventDefault();doMove(d[0],d[1]);return}
  if(k===' '){ev.preventDefault();closeInspect();if(S.mode==='combat')endHeroTurn();else exploreStep(0,0);return}
  if(k==='.'){if(S.mode==='explore')exploreStep(0,0);return}
  if(k==='>'||(k==='Enter'&&S.mode==='explore')){descend(false);return}
  if(k==='Enter'&&S.mode==='combat'){endHeroTurn();return}
  if(k==='l'){toggleLantern();return}
  const hot={b:'breath',t:'stone',r:'draught',x:'charge',v:'ink',f:'oil',o:'autoexp',k:'camp'};if(hot[k]){selectAb(hot[k]);return}
  if(/^[0-9]$/.test(k)){const n=+k;if(n>=1&&n<=5){const id=cls().abilities[n-1];if(id)selectAb(id)}else if(S.mode==='combat'){selectAb(COMBAT_KEYS[n])}}});
$('pad').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||!S||S.busy||S.over)return;const[dx,dy]=b.dataset.d.split(',').map(Number);
  if(SEL.id){if(!dx&&!dy){confirmSel();return}const c=SEL.cursor||{x:S.P.x,y:S.P.y};SEL.cursor={x:c.x+dx,y:c.y+dy};UI.render();return}
  if(!dx&&!dy){if(S.mode==='combat')endHeroTurn();else exploreStep(0,0);return}doMove(dx,dy)});
$('helpBtn').onclick=()=>showHelp();
$('journalBtn').onclick=()=>UI.journal();
UI.inspectAt=(x,y)=>{const r=cv.getBoundingClientRect();openInspect(x,y,r.left+(x*T+T/2-camX)*ZOOM,r.top+(y*T+T/2-camY)*ZOOM)};

function start(data){resize();loadMeta();const sv=loadSave();

  requestAnimationFrame(frame);UI.render()}
function showIntro(){ov.innerHTML=`<div class="card" style="max-width:560px"><h2>Saltmarrow</h2><p class="say" style="text-align:center">A mining village on a cliff above a sea that dried up before anyone remembers. The salt has always come up from the deep. Lately, other things have too.</p><p>Mayor Hale is paying for someone to go down. Talk to the people in the street, then walk to the lift head at the east end.</p><p style="color:var(--dim)">${document.body.classList.contains('mob')?'Tap to walk and act. Hold your finger on anything to see what it is and what you can do with it. Drag to look around, pinch to zoom.':'Left-click to walk and act. Right-click anything to inspect it. Press ? for the full controls.'}</p><button class="btn primary" id="introGo">Step into the rain</button></div>`;ov.hidden=false;$('introGo').onclick=()=>{ov.hidden=true};$('introGo').focus()}
/* ---------- phones and tablets: layout, gestures, sheets ---------- */
const UIP=(()=>{try{return JSON.parse(localStorage.getItem('saltmarrow-ui')||'{}')}catch(e){return{}}})();
const saveUIP=()=>{try{localStorage.setItem('saltmarrow-ui',JSON.stringify(UIP))}catch(e){}};
const isMob=()=>matchMedia('(pointer:coarse)').matches||innerWidth<620;
function autoZoomD(){const w=$('stage').clientWidth||innerWidth;return Math.max(1,Math.min(2.5,Math.floor(w/(24*32)*4)/4))}
function applyMob(){const on=isMob();const full=!on&&innerWidth>=860;document.body.classList.toggle('mob',on);document.body.classList.toggle('full',full);document.body.classList.toggle('bot',full&&UIP.layout!=='side');const lb=$('layBtn');if(lb)lb.textContent='Layout: '+(UIP.layout==='side'?'side':'bottom');document.body.classList.toggle('pad-on',on&&!!UIP.pad);
  $('padBtn').textContent='Arrows: '+(UIP.pad?'on':'off');ZOOM=on?(UIP.zoom||1):(UIP.zoomD||autoZoomD())}
applyMob();
const TOUCHY=()=>document.body.classList.contains('mob');

/* menu */

function toggleMenu(on){if(on==null)on=!menuOpen();hb.classList.toggle('open',on);document.body.classList.toggle('menuon',on);if(on){try{UI.stopWalk()}catch(e){}AUTO.on=false;const f=hb.querySelector('.btn');if(f&&!isMob())f.focus({preventScroll:true})}}
$('menuBtn').onclick=ev=>{ev.stopPropagation();toggleMenu()};
hb.addEventListener('click',ev=>{if(ev.target.closest('#zoomIn,#zoomOut,#zoomInD,#zoomOutD,#padBtn,#paceBtn,#feedBtn,#rtBtn,#layBtn,.mhead'))return;if(ev.target.closest('.btn'))toggleMenu(false)});
document.addEventListener('pointerdown',ev=>{if(menuOpen()&&!hb.contains(ev.target)&&ev.target!==$('menuBtn'))toggleMenu(false)});
$('gearBtnM').onclick=()=>{if(S&&S.L&&!S.L.town)UI.gear();else if(S)UI.cottage()};
$('padBtn').onclick=()=>{UIP.pad=!UIP.pad;saveUIP();applyMob();setTimeout(resize,0)};

{const rh=renderHud;renderHud=function(){rh();if(!TOUCHY()||!S||!S.P)return;const P=S.P,c=cls();const pct=Math.max(0,P.stam)/P.max*100;
