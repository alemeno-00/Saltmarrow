<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A gothic roguelike: descend beneath Saltmarrow, ring the bells, survive the Dread.">
<title>Saltmarrow Deep</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#090d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=UnifrakturMaguntia&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=Spline+Sans+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one dungeon screen. Map with HUD overlays + hotbar on the left, hero sheet / satchel / log on the right; stacks on phones. Single dark world by design. */
:root{
  --abyss:#090d10; --hull:#10171a; --hull-2:#162024; --hull-3:#1d2a2f; --line:#26363a;
  --bone:#e2d9c6; --dim:#8a978f; --verdigris:#6fb5a0; --lantern:#e3a548; --rust:#c2533e; --violet:#b9a0e8; --sky:#7fb0e0;
  --display:"Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --mono:"Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --prose:"IM Fell English", "Iowan Old Style", Georgia, serif; --dread:#9a6ad8;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--abyss);color:var(--bone)}
body{font-family:var(--mono);font-size:13px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--lantern);outline-offset:1px}
.wrap{max-width:1240px;margin:0 auto;padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.4vw,40px);line-height:1;margin:0;text-wrap:balance}
h1 span{color:var(--lantern)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:620px){.hbtns .btn{padding:6px 8px;font-size:11.5px}}
.btn{background:var(--hull-2);border:1px solid var(--line);border-radius:6px;font-size:12.5px;padding:7px 12px;cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--verdigris)}
.btn.primary{border-color:var(--lantern);color:var(--lantern)}
.btn.primary:hover:not(:disabled){background:#2a2414}
.btn:disabled{opacity:.4;cursor:default}
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
@media (max-width:860px){.game{grid-template-columns:minmax(0,1fr)}}
.left{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;min-width:0;background:#040a0b;border:1px solid var(--line);border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
/* Saltmarrow art-direction pass: deep vignette, mineral edgework, candlelit accents, and a unified carved-frame UI. */
.stage{isolation:isolate;box-shadow:inset 0 0 0 1px rgba(111,181,160,.08),0 8px 26px rgba(0,0,0,.28)}
.stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 42%,rgba(1,7,9,.18) 72%,rgba(1,5,7,.58) 100%),linear-gradient(180deg,rgba(8,17,20,.14),transparent 24%,transparent 78%,rgba(1,7,8,.22));box-shadow:inset 0 0 0 1px rgba(190,213,188,.04)}
.stage canvas{position:relative;z-index:0}
.stage .hud-tl,.stage .tracker,.stage .toast,.stage .tip,.stage .inspect{z-index:2}
.panel,.card,.sheet,.side-panel{box-shadow:inset 0 1px 0 rgba(205,221,194,.035),0 5px 16px rgba(0,0,0,.16)}
.panel,.card,.sheet{border-color:#304247}
.btn{background:linear-gradient(180deg,#1b292c,#11191c);border-color:#34474a;box-shadow:inset 0 1px 0 rgba(225,230,207,.045)}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#263a3a,#152124);box-shadow:0 0 0 1px rgba(111,181,160,.08),inset 0 1px 0 rgba(225,230,207,.07)}
.btn.primary{background:linear-gradient(180deg,#302719,#1b1913);border-color:#8e6a32;text-shadow:0 0 12px rgba(227,165,72,.12)}
h1,h2,h3,.panel-title,.section-title{ text-shadow:0 1px 0 #000,0 0 18px rgba(111,181,160,.08)}
.chip,.tok,.tip{backdrop-filter:blur(3px);box-shadow:0 2px 7px rgba(0,0,0,.22)}
.tok{border-color:#34464a}
.inspect{background:linear-gradient(145deg,rgba(20,31,33,.98),rgba(8,14,16,.98));border-color:#a47b3d;box-shadow:0 10px 34px rgba(0,0,0,.72),inset 0 1px 0 rgba(240,218,165,.08)}
canvas{image-rendering:pixelated}
@media(prefers-reduced-transparency:reduce){.stage:after{background:rgba(1,7,9,.08)}}
canvas{display:block;width:100%;touch-action:manipulation;image-rendering:pixelated;cursor:default}
/* SALTMARROW DEEP — complete atmospheric art direction pass */
:root{--ink:#080d0f;--salt:#b8c7b8;--brass:#b58a4b;--moss:#527b68;--rust:#9c493d}
body{background:radial-gradient(ellipse at 50% 12%,#172326 0,#0b1113 42%,#050809 100%);color:#d0d5c7}
.stage{isolation:isolate;background:#070c0e;box-shadow:inset 0 0 0 1px #28383a,0 18px 48px #0009}
.stage:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.045) 3px 4px),radial-gradient(ellipse at center,transparent 46%,rgba(1,5,7,.23) 78%,rgba(1,4,5,.7) 100%);mix-blend-mode:multiply}
.stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(184,199,184,.08),inset 0 0 32px rgba(0,0,0,.28)}
.stage canvas{filter:contrast(1.055) saturate(.92)}
.panel,.card,.sheet,.side-panel{background:linear-gradient(145deg,rgba(26,38,39,.98),rgba(11,17,19,.99));border-color:#344749;box-shadow:inset 0 1px 0 #d4dfc90a,0 8px 24px #0005}
.btn{border-radius:2px;letter-spacing:.025em;transition:background .12s,border-color .12s,transform .12s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:linear-gradient(#3a3020,#1b1a14);border-color:#9b7843;color:#f0d7a1}
h1,h2,h3,.panel-title,.section-title{letter-spacing:.035em}
.inspect{background:linear-gradient(150deg,#1a2929fa,#090f11fa);border:1px solid #a4864e;box-shadow:0 12px 40px #000b,inset 0 1px #f5df9b18}
.hp,.health,.meter{filter:drop-shadow(0 1px 1px #000)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

/* HUD on the map */
.hud-tl{position:absolute;top:8px;left:8px;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chip{background:rgba(9,13,16,.82);border:1px solid var(--line);border-radius:5px;padding:3px 9px;font-size:11.5px;white-space:nowrap}
.chip b{color:var(--lantern);font-weight:500}
.chip.warn{color:var(--lantern)}.chip.bad{color:#e88a74}.chip.good{color:var(--verdigris)}
.tracker{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;max-width:calc(100% - 16px)}
.tracker .rnd{font-size:11.5px}
.tracker .rnd .foe{color:#e88a74}
.order{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.tok{width:30px;background:rgba(9,13,16,.85);border:1px solid var(--line);border-radius:4px;padding:2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tok img{width:24px;height:24px;image-rendering:pixelated}
.tok i{display:block;height:3px;width:100%;background:#2a0c08;border-radius:2px;overflow:hidden}
.tok i b{display:block;height:100%;background:var(--rust)}
.tok.hero{border-color:var(--verdigris)}.tok.hero i b{background:var(--verdigris)}
.tok.now{box-shadow:0 0 0 2px var(--lantern)}
.tok.dim{opacity:.4}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;animation:toast 2.2s ease forwards}
.toast h3{font-family:var(--display);font-size:clamp(30px,6vw,46px);margin:0;line-height:1;color:var(--lantern);text-shadow:0 2px 0 #000,0 0 24px rgba(0,0,0,.8)}
.toast p{margin:4px 0 0;color:var(--bone);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 1px 0 #000}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none;opacity:0}}
.tip{position:absolute;pointer-events:none;background:rgba(9,13,16,.94);border:1px solid var(--line);border-radius:5px;padding:5px 9px;font-size:11.5px;max-width:240px;z-index:3;line-height:1.45}
.tip b{font-weight:500;color:var(--bone)}
.tip .s{color:var(--dim)}
.tip .t{color:var(--violet)}
.inspect{position:absolute;z-index:4;width:min(300px,calc(100% - 16px));background:var(--hull);border:1px solid var(--lantern);border-radius:8px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
.inspect .hd{display:flex;gap:10px;align-items:center}
.inspect .hd img{width:40px;height:40px;image-rendering:pixelated;background:#0a1214;border-radius:4px;flex:none}
.inspect h4{margin:0;font-family:var(--display);font-size:22px;line-height:1;color:var(--lantern);font-weight:700}
.inspect .sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.inspect p{margin:0;font-size:12px;line-height:1.55}
.inspect .stats{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
.inspect .stats span{color:var(--dim)}
.inspect .acts{display:flex;flex-direction:column;gap:4px}
.inspect .acts .btn{text-align:left}
.inspect .x{position:absolute;top:6px;right:8px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:2px 6px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,10,.9);padding:16px;overflow:auto;z-index:50}
@media (max-width:860px){.overlay{position:fixed;align-items:flex-start;padding-block:max(16px,env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(5,8,10,.97);z-index:50}}
@media (max-width:620px){.tracker{top:36px}}
/* hotbar */
.bar{background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px}
.bar-top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;min-height:32px}
.econ{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{font-size:11px;padding:3px 8px;border-radius:12px;border:1px solid currentColor;display:flex;gap:5px;align-items:center}
.pip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pip.move{color:var(--sky)}.pip.man{color:var(--verdigris)}.pip.main{color:var(--lantern)}
.pip.used{color:#3a4a4e}.pip.used::before{background:transparent;border:1px solid currentColor}
.res{font-size:11.5px;color:var(--lantern)}
.prompt{font-size:12px;color:var(--bone);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prompt b{color:var(--lantern);font-weight:500}
.prompt .s{color:var(--dim)}
.slots{display:flex;gap:6px;flex-wrap:wrap;row-gap:6px}
@media (max-width:620px){.slots{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}}
.grp{display:flex;gap:4px;padding-right:6px;border-right:1px solid var(--line);flex:none;flex-wrap:wrap}
.grp:last-child{border-right:none}
.sl{position:relative;width:58px;height:60px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--hull-2);border:1px solid var(--line);border-radius:6px;cursor:pointer;padding:4px 2px 3px;touch-action:manipulation}
.sl::before{content:"";position:absolute;left:6px;right:6px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--c,transparent)}
.sl.main{--c:var(--lantern)}.sl.man{--c:var(--verdigris)}.sl.move{--c:var(--sky)}
.sl:hover:not(:disabled){border-color:var(--c,var(--verdigris));background:var(--hull-3)}
.sl.sel{border-color:var(--lantern);background:#2a2414}
.sl:disabled{opacity:.33;cursor:default}
.sl img{width:24px;height:24px;image-rendering:pixelated}
.sl .nm{font-size:9.5px;line-height:1.1;text-align:center;color:var(--bone);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .k{position:absolute;top:3px;left:4px;font-size:9.5px;color:var(--dim)}
.sl .q{position:absolute;top:2px;right:4px;font-size:10px;color:var(--lantern);font-weight:700}
.sl .q.n{color:var(--bone)}
.endturn{font-size:13px;padding:8px 16px}
/* side panel */
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.box{background:var(--hull);border:1px solid var(--line);border-radius:8px;padding:12px}
.label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.who{display:flex;gap:10px;align-items:center}
.who img{width:44px;height:44px;image-rendering:pixelated;background:#0a1214;border-radius:6px;flex:none}
.who h2{font-family:var(--display);font-size:24px;line-height:1;margin:0;color:var(--lantern);font-weight:700}
.who .s{font-size:11px;color:var(--dim)}
.bar2{position:relative;height:10px;background:#06100f;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--rust);transition:width .25s}
.bar2 .wind{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--bone);opacity:.45}
.bar2.xp{height:5px}.bar2.xp i{background:var(--violet)}
.row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums;font-size:12.5px}
.row b{font-weight:500}
.row span{color:var(--dim)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--verdigris);display:inline-block}
.dots i.off{background:#1f3633}
.dots.res i{background:var(--lantern);border-radius:2px;transform:rotate(45deg);width:8px;height:8px}
.chars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px;text-align:center}
.chars div{background:var(--hull-2);border-radius:4px;padding:2px 0;font-variant-numeric:tabular-nums;font-size:12px}
.chars small{display:block;color:var(--dim);font-size:9.5px;letter-spacing:.08em}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.stat{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--violet)}
.stat.good{color:var(--verdigris)}.stat.warn{color:var(--lantern)}.stat.bad{color:#e88a74}.stat.dim{color:var(--dim)}
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.it{box-sizing:border-box;display:flex;align-items:center;gap:6px;background:var(--hull-2);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px;cursor:pointer;text-align:left;width:100%}
.it:hover:not(:disabled){border-color:var(--verdigris)}
.it:disabled{opacity:.4;cursor:default}
.it img{width:24px;height:24px;image-rendering:pixelated;flex:none}
.it b{margin-left:auto}
.it.coin{cursor:default}
.trink{margin-top:8px;display:grid;gap:2px;font-size:11.5px}
.trink b{color:var(--lantern);font-weight:500}
.log{display:flex;flex-direction:column;gap:3px;height:13em;overflow-y:auto;font-size:12px;padding-right:4px;scrollbar-width:thin}
.log p{margin:0;flex:none}
.log p.old{opacity:.6}
.log p.bad{color:#e88a74}.log p.good{color:var(--verdigris)}.log p.gold{color:var(--lantern)}.log p.roll{color:var(--violet)}
.controls{display:none;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:860px),(pointer:coarse){.controls{display:flex}}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:5px}
.pad button{background:var(--hull-2);border:1px solid var(--line);border-radius:6px;font-size:18px;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--line)}
.pad .mid{font-size:11px;color:var(--dim)}
.help-tip{font-size:11.5px;color:var(--dim);max-width:28ch;line-height:1.55}
/* tutorial tip */
.tipcard{position:absolute;left:10px;bottom:10px;max-width:min(380px,calc(100% - 20px));background:rgba(16,23,26,.95);border:1px solid var(--lantern);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;z-index:3;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.tipcard p{margin:0;font-family:var(--prose);font-size:15px;line-height:1.5}
.tipcard .row{align-items:center}
.log p.guide{color:var(--lantern);font-style:italic}
textarea.code{width:100%;min-height:90px;background:var(--hull-2);color:var(--bone);border:1px solid var(--line);border-radius:6px;font:11px var(--mono);padding:8px;resize:vertical}
/* modals */
.mdl{width:100%;max-width:680px;background:var(--hull);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.mdl.wide{max-width:900px}
.mhd{display:flex;gap:12px;align-items:center}
.mhd img{width:56px;height:56px;image-rendering:pixelated;background:#0a1214;border-radius:6px;flex:none}
.mhd h2{font-family:var(--display);font-size:30px;margin:0;line-height:1;color:var(--lantern);font-weight:700}
.mhd .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.mhd .x{margin-left:auto}
.say{font-family:var(--prose);font-size:17px;line-height:1.6;color:var(--bone);margin:0;max-width:62ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opts .btn{text-align:left;font-size:13px;padding:9px 12px}
.opts .btn::before{content:"› ";color:var(--lantern)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs .btn.on{border-color:var(--lantern);color:var(--lantern)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;max-height:min(52vh,460px);overflow-y:auto;padding-right:4px}
.itm{background:var(--hull-2);border:1px solid var(--line);border-radius:7px;padding:9px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;min-width:0}
.itm .t{display:flex;gap:8px;align-items:center}
.itm .t img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.itm .t b{font-weight:500;font-size:12.5px;line-height:1.25}
.itm .r{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.itm ul{margin:0;padding-left:14px;color:var(--dim);line-height:1.5}
.itm ul li.cur{color:#e88a74}
.itm .row2{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-top:auto;flex-wrap:wrap}
.itm .pr{color:var(--lantern);font-variant-numeric:tabular-nums}
.itm.eq{border-color:var(--verdigris)}
.itm.lock{opacity:.5}
.purse{font-size:12px;color:var(--dim)}.purse b{color:var(--lantern);font-weight:500}
.sect{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:2px 0 -4px}
.lore{font-family:var(--prose);font-size:15px;line-height:1.6}
.lore h4{font-family:var(--display);font-size:18px;color:var(--lantern);margin:0 0 2px;font-weight:700}
.lore p{margin:0 0 10px}
.qst{display:flex;flex-direction:column;gap:2px;font-size:12.5px;padding:8px 10px;background:var(--hull-2);border-radius:6px}
.qst b{color:var(--lantern);font-weight:500}.qst .dn{color:var(--verdigris)}.qst .td{color:var(--dim)}
.bar2.dread{height:6px}.bar2.dread i{background:var(--dread)!important}
.epi{font-family:var(--prose);font-size:17px;line-height:1.7;max-width:60ch;margin:0}

 isolation:isolate;backdrop-filter:none}

  if(S.L.objs)for(const o of S.L.objs)if(FEAT[o.type].block)blk[I(o.x,o.y)]=1;
  for(let h=0;h<q.length;h++){const n=q[h],x=n%W,y=(n/W)|0;for(const[dx,dy]of DIR8){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const ni=I(nx,ny),t=S.L.map[ni];
    if(t===WALL||t===CRACK||t===PIT||(t===GATE&&!gatesOpen)||d[ni]>=0||blk[ni])continue;d[ni]=d[n]+1;q.push(ni)}}return d}
function rebuildOpq(){const L=S.L;L.opq=new Uint8Array(W*H);for(const o of L.objs)if(FEAT[o.type].opaque)L.opq[I(o.x,o.y)]=1}

function rollRarity(d,luck){const r=Math.random()*100-(luck||0);const e=4+d*2,s=12+d*2,f=34;if(r<e)return'eldritch';if(r<e+s)return'storied';if(r<e+s+f)return'fine';return'worn'}
function genWeapon(d,rar,base){rar=rar||rollRarity(d);base=base||pick(Object.keys(WBASE));const R=RARITY[rar];let budget=R.b+Math.floor(d/2);
  const it={id:'i'+Math.random().toString(36).slice(2,9),kind:'weapon',base,rar,aff:{},curse:null,ident:rar==='worn',d};
  if(rar==='eldritch'||(rar!=='worn'&&Math.random()<0.18)){const c=pick(Object.keys(CURSE));it.curse=c;budget+=CURSE[c].w+(rar==='eldritch'?2:0)}
  let guard=0;while(budget>0&&guard++<40){const opts=Object.keys(AFFIX).filter(k=>(it.aff[k]||0)<AFFIX[k].max&&AFFIX[k].cost<=budget&&!(k==='el'&&WBASE[base].base.el));if(!opts.length)break;const k=pick(opts);it.aff[k]=(it.aff[k]||0)+1;budget-=AFFIX[k].cost;if(k==='el')it.el=pick(['fire','frost','lightning','void','holy'])}
  it.name=weaponName(it);it.value=itemValue(it);return it}
function weaponName(it){const B=WBASE[it.base],noun=pick(NOUNS[it.base]);const keys=Object.keys(it.aff).sort((a,b)=>it.aff[b]*AFFIX[b].cost-it.aff[a]*AFFIX[a].cost);const top=keys[0];
  if(it.rar==='worn')return`${pick(WORN)} ${B.name}`;
  if(it.rar==='fine')return`${B.name.replace(/^./,c=>c.toUpperCase())} ${top==='el'?'of '+it.el:SUFFIX[top]||''}`.trim();
  if(it.rar==='storied'){const o=pick(OWNERS);return`${o.replace(/^./,c=>c.toUpperCase())}'s ${noun}`}
  return`The ${noun} That ${pick(VERBS)}`}
function itemValue(it){if(it.kind==='armor'){let v=12+it.d*4+(ABASE[it.base].base.armor||0)*12;for(const k in it.aff)v+=it.aff[k]*AFFIX[k].cost*10;return Math.max(10,v)}if(it.kind==='tome')return 30+it.sp.cost*18+it.d*6+(it.rar==='eldritch'?40:0);let v=15+it.d*5;for(const k in it.aff)v+=it.aff[k]*AFFIX[k].cost*10;if(it.curse)v-=CURSE[it.curse].w*6;return Math.max(10,v)}

const SHAPES={bolt:{act:'main',kind:'ranged',range:8,mul:1.5,base:2},area:{act:'main',kind:'area',range:8,radius:1,mul:1.15,base:1},burst:{act:'main',kind:'burst',radius:1,mul:1.3,base:2},ward:{act:'maneuver',kind:'none'},blink:{act:'maneuver',kind:'step'}};

const TOME_N=['Litany','Psalm','Canticle','Grimoire','Testament','Hymnal','Catechism','Liturgy'];
function genTome(d,rar){rar=rar||rollRarity(d);const sh=Math.random()<0.18?pick(['ward','blink']):pick(['bolt','bolt','area','burst']);const el=pick(Object.keys(ELEM));
  const cost=Math.max(1,Math.min(5,{worn:1,fine:2,storied:3,eldritch:4}[rar]+rnd(2)));const S0=SHAPES[sh];
  const sp={shape:sh,el,cost,act:S0.act,kind:S0.kind,range:S0.range,radius:S0.radius,rider:null,dread:rar==='eldritch'?2:el==='void'?1:0};
  if(S0.mul){let d2=S0.base+cost*S0.mul+Math.floor(d/3);if(rar==='eldritch')d2*=1.35;const riders=['push','pull','daze','weaken','smoke',null];sp.rider=sh==='burst'&&Math.random()<0.5?'push':pick(riders);if(!sp.rider)d2+=1;if(sp.rider==='pull'&&sh!=='bolt')sp.rider='push';
    sp.t=[Math.max(1,Math.round(d2*0.55)),Math.round(d2),Math.round(d2*1.45)].map((v,i)=>{const t={d:v};if(sp.rider==='push'&&i>0)t.push=1+i;if(sp.rider==='pull'&&i>0)t.pull=1+i;if(sp.rider==='daze'&&i===2)t.cond='dazed';if(sp.rider==='weaken'&&i>0)t.cond='weakened';if(el==='frost'&&i>0&&!t.cond)t.cond='slowed';return t})}
  else if(sh==='ward')sp.amt=4+cost*3+Math.floor(d/2);else{sp.range=3+cost}
  const it={id:'i'+Math.random().toString(36).slice(2,9),kind:'tome',rar,sp,ident:true,d};
  it.name=`${pick(TOME_N)} of ${pick(EL_WORDS[el])}`;sp.name=it.name.replace(/^(\w+) of /,(m,a)=>a+' of ');it.value=itemValue(it);return it}
function tomeAb(it){const sp=it.sp;const ab={name:it.name,icon:{fire:'flame',frost:'drop',lightning:'bolt',holy:'sun',void:'eye2',blood:'heart'}[sp.el]||'bolt',cost:sp.cost,act:sp.act,kind:sp.kind,range:sp.range,radius:sp.radius,stat:'R',el:sp.el,tome:it.id,tomeDread:sp.dread,
  desc:sp.shape==='ward'?`Wrap yourself in ${sp.el}: gain ${sp.amt} temporary stamina.`:sp.shape==='blink'?`Step through the dark up to ${sp.range} squares without provoking.`:`${{bolt:`A bolt of ${sp.el}`,area:`A 3×3 eruption of ${sp.el}`,burst:`A burst of ${sp.el} around you`}[sp.shape]}.${sp.rider==='smoke'?' Leaves smoke.':''}${sp.dread?` Raises your Dread by ${sp.dread}.`:''}`};
  if(sp.t){ab.t=sp.t;if(sp.el==='lightning')ab.lightning=true;if(sp.rider==='smoke')ab.smoke=true}if(sp.shape==='ward'){ab.ward=sp.amt}if(sp.shape==='blink'){ab.blink=true}
  return ab}
/* equipment stat lookup */
function wpn(){return S&&S.gear?S.gear.weapon:null}
function gearSum(k){const w=wpn();let v=0;if(w&&w.ident!==false){v+=(w.aff[k]||0);const b=WBASE[w.base].base;if(b[k])v+=b[k]}else if(w){v+=(w.aff[k]||0);const b=WBASE[w.base].base;if(b[k])v+=b[k]}
  for(const a of armPieces()){v+=(a.aff[k]||0);const b=ABASE[a.base];if(b&&b.base[k])v+=b.base[k]}
  if(S.bless&&S.bless[k])v+=S.bless[k];if(S.kitEff&&S.kitEff[k])v+=S.kitEff[k];if(S.gear&&S.gear.relic){const e=RELICS[S.gear.relic.r].eff;if(e[k])v+=e[k]}return v}
const curse=k=>{const w=wpn();return !!(w&&w.curse===k)};
const suited=()=>{const w=wpn();return !!(w&&WBASE[w.base].cls===S.cls)};
function weaponEl(){const w=wpn();if(!w)return null;return WBASE[w.base].base.el||w.el||null}
function itemLines(it){const out=[];if(it.kind==='relic')return[RELICS[it.r].desc];if(it.kind==='armor'){const B=ABASE[it.base];out.push(B.note);for(const k in it.aff)out.push(AFFIX[k].txt(it.aff[k],it));return out}if(it.kind==='tome'){const a=tomeAb(it);out.push(`${a.act==='main'?'Main action':'Maneuver'} · costs ${it.sp.cost} heroic resource`);out.push(a.desc);if(a.t)out.push('Tiers: '+a.t.map(t=>t.d+(t.cond?' '+t.cond:'')+(t.push?' push '+t.push:'')+(t.pull?' pull '+t.pull:'')).join(' / '));return out}
  const B=WBASE[it.base];out.push(B.note+(B.cls?` · suits the ${CLASSES[B.cls]?CLASSES[B.cls].name:''} (+1 damage)`:''));
  if(!it.ident){out.push('Unidentified. Equip it, or have Sister Agathe read it, to learn its nature.');return out}
  for(const k in it.aff)out.push(AFFIX[k].txt(it.aff[k],it));if(it.curse)out.push('Curse: '+CURSE[it.curse].txt);return out}
const kindName=it=>it.kind==='tome'?'tome':it.kind==='relic'?'relic':it.kind==='armor'?ABASE[it.base].name:WBASE[it.base].name;
const itemTitle=it=>it.ident===false?`Unidentified ${kindName(it)}`:it.name;

function armPieces(){const a=S&&S.gear&&S.gear.arm;if(!a)return[];const out=[];for(const k of ASLOTS)if(a[k])out.push(a[k]);return out}
function armorTotal(){return gearSum('armor')}
function genArmor(d,rar,base){rar=rar||rollRarity(d);if(!base){const ok=Object.keys(ABASE).filter(k=>!ABASE[k].minD||d>=ABASE[k].minD);base=pick(ok)}
  const B=ABASE[base];let budget=Math.max(0,RARITY[rar].b-2+Math.floor(d/3));
  const it={id:'i'+Math.random().toString(36).slice(2,9),kind:'armor',slot:B.slot,base,rar,aff:{},ident:true,d};
  let guard=0;while(budget>0&&guard++<40){const opts=AFF_ARM.filter(k=>(it.aff[k]||0)<AFFIX[k].max&&AFFIX[k].cost<=budget&&!(k==='speed'&&B.slot!=='feet')&&!(k==='light'&&B.slot!=='head'));if(!opts.length)break;const k=pick(opts);it.aff[k]=(it.aff[k]||0)+1;budget-=AFFIX[k].cost}
  const keys=Object.keys(it.aff).sort((a,b)=>it.aff[b]*AFFIX[b].cost-it.aff[a]*AFFIX[a].cost),top=keys[0],nm=B.name.replace(/^./,c=>c.toUpperCase());
  it.name=rar==='worn'?`${pick(WORN)} ${B.name}`:rar==='fine'?`${nm} ${top?SUFFIX[top]||'':''}`.trim():rar==='storied'?`${pick(OWNERS).replace(/^./,c=>c.toUpperCase())}'s ${pick(ANOUN[B.slot])}`:`The ${pick(ANOUN[B.slot])} That ${pick(VERBS)}`;

/* ================= dread ================= */
const WHISPERS=['Someone is breathing just behind you.','You hear your name, spoken from inside the wall.','The salt tastes of tears.','Something in the dark is counting your steps.','She is dreaming of you.','Your lantern flame bends toward the deep.','A child is singing a hymn, very far below.','You remember drowning. You have never drowned.','The walls are wet and warm.','Do not look at the water.','It knows the shape of your face now.','Footsteps stop when yours do.'];
function addDread(n,why){if(!S||!S.P||!S.L||S.L.town||n<=0)return;const P=S.P;
  if((gearSum('steady')||(S.bless&&S.bless.steady))&&Math.random()<0.4)n--;if(S.cls==='flag'&&litAt(P.x,P.y))n=Math.floor(n/2);if(n<=0)return;
  if(relic('finger'))n++;const was=P.dread||0;P.dread=Math.min(10,was+n);if(why)log(why,'dread');
  if(was<4&&P.dread>=4)log('Your hands will not stop shaking.','dread');if(was<7&&P.dread>=7)log('The walls are breathing. Dread is clouding your judgement.','dread');
  if(P.dread>=10)snap()}
function easeDread(n,why){const P=S.P;if(!P.dread)return;P.dread=Math.max(0,P.dread-n);if(why)log(why,'good')}
function snap(){const P=S.P;const r=d10();P.dread=6;UI.fx('shake',{m:6});
  if(r>=8){log('Revelation. For a moment you see the shape of everything, and it is beautiful.','dread');P.insight=1;for(let dy=-10;dy<=10;dy++)for(let dx=-10;dx<=10;dx++){const x=P.x+dx,y=P.y+dy;if(inb(x,y))S.L.seen[I(x,y)]=1}UI.toast('Revelation','Your next attack tears with void');return}
  const k=rnd(4);UI.toast('Your mind breaks','Dread overwhelms you');
  if(k===0){log('You scream. You cannot stop screaming.','dread');noise(P.x,P.y,12)}
  else if(k===1){log('You drop your lantern and stamp out the light in a panic.','dread');P.lantern=false;computeFov()}

function epilogue(id){const L=[];
  const head={break:["You put the Abbot down, and this time he stays down. Far below, something vast turns over in its sleep.","By spring the salt has stopped. By autumn the springs run fresh, then brackish, then cold and black. The sea is coming back to the valley, a hand's breadth every year.","Saltmarrow does not drown all at once. It takes a generation. But it is free, for whatever that is worth."],
    renew:["You take the crozier from his hand. It is warm. The water rises to your knees, your waist, your throat, and you find you do not need to breathe.","Up above, the salt flows again. The lottery is drawn each season. They call it the highest grace.","Sometimes a delver comes down with a lantern and a hopeful face. You let them get very close before you sing."],
    agathe:["Agathe walks into the black water without looking back. She is singing the psalm her great-grandmother wrote, and for the first time it sounds like a lullaby.","The Mother sleeps without dreaming. The salt is only salt now, and the seams run thin. Saltmarrow grows poor, and quiet, and safe.","Every night you hear her singing, very faintly, from the bottom of the shaft. You tell no one."],

  if(flag('pipFreed'))L.push(id==='break'||id==='agathe'||id==='hale'?'Pip went back down the shaft one night without a lamp. Tobias still leaves the forge door open for him.':'Pip sings at the forge now, the same hymn, over and over. Tobias has stopped asking him to stop.');
  if(flag('nellFreed'))L.push('Nell Thorn keeps a garden of pale caps behind the apothecary. She says she only uses them for medicine.');
  if(flag('bribed'))L.push('The Mayor\'s silver bought you a fine house on the cliff. You sleep badly in it.');
  L.push('Bram tells the story in the Drowned Lamb most nights. He gets it wrong every time, and you never correct him.');

function genLevel(){

      switch(shape){case'round':return nx*nx+ny*ny<=1.08;case'cave':return nx*nx+ny*ny<=0.78+Math.random()*0.5;case'cross':return Math.abs(nx)<0.5||Math.abs(ny)<0.5;
        case'octa':{const c=Math.max(1,Math.floor(Math.min(w,h)/3));const dx=Math.min(i-x,x+w-1-i),dy=Math.min(j-y,y+h-1-j);return dx+dy>=c}default:return true}};
    for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){resv[I(i,j)]=1;if(inShape(i,j))carve(i,j,r)}
    if(shape==='pillar')for(let j=y+1;j<y+h-1;j++)for(let i=x+1;i<x+w-1;i++)if((i-x)%3===1&&(j-y)%3===1&&i!==cx&&j!==cy){map[I(i,j)]=WALL;reg[I(i,j)]=-1}

  const LW=boss?W:47,LH=boss?H:33;
  if(boss)addRoom(23,15,17,13,{chapel:true});
  for(let t=0;t<320&&rooms.length<(boss?11:10);t++){
    const w=rr(2,5)*2+1,h=rr(2,4)*2+1,x=rr(0,(LW-2-w)>>1)*2+1,y=rr(0,(LH-2-h)>>1)*2+1;
    if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;addRoom(x,y,w,h)}

  for(let y=1;y<LH-1;y+=2)for(let x=1;x<LW-1;x+=2){if(map[I(x,y)]!==WALL||resv[I(x,y)])continue;const r=nreg++;carve(x,y,r);const st=[[x,y]];let last=null;
    while(st.length){const[cx,cy]=st[st.length-1];const opts=DIR4.filter(([dx,dy])=>{const nx=cx+dx*2,ny=cy+dy*2;return nx>0&&ny>0&&nx<LW-1&&ny<LH-1&&map[I(nx,ny)]===WALL&&!resv[I(nx,ny)]&&!resv[I(cx+dx,cy+dy)]});
      if(opts.length){const d=(last&&opts.includes(last)&&Math.random()<straight)?last:pick(opts);carve(cx+d[0],cy+d[1],r);carve(cx+d[0]*2,cy+d[1]*2,r);st.push([cx+d[0]*2,cy+d[1]*2]);last=d}else{st.pop();last=null}}}

  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){if(map[I(x,y)]!==WALL)continue;const rs=new Set();for(const[dx,dy]of DIR4){const g=reg[I(x+dx,y+dy)];if(g>=0)rs.add(g)}if(rs.size>=2)conns.push({x,y,rs:[...rs]})}
  const par=[...Array(nreg).keys()];const find=a=>{while(par[a]!==a){par[a]=par[par[a]];a=par[a]}return a};
  const openC=c=>{map[I(c.x,c.y)]=c.rs.some(r=>roomReg.has(r))&&Math.random()<0.75?DOOR:FLOOR;reg[I(c.x,c.y)]=c.rs[0];c.done=true};
  for(;;){const live=conns.filter(c=>!c.done&&new Set(c.rs.map(find)).size>1);if(!live.length)break;const c=pick(live);openC(c);const r0=find(c.rs[0]);for(const r of c.rs)par[find(r)]=r0}

  for(let pass=0;pass<60;pass++){const kill=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=I(x,y);if((map[i]!==FLOOR&&map[i]!==DOOR)||inRoom(x,y))continue;let n=0;for(const[dx,dy]of DIR4)if(map[I(x+dx,y+dy)]!==WALL)n++;if(n<=1)kill.push(i)}if(!kill.length)break;kill.forEach(i=>map[i]=WALL)}

      if(DIR8.some(([dx,dy])=>map[I(x+dx,y+dy)]===DOOR))continue;let n=0,rg=-1;for(const[dx,dy]of DIR8){const j=I(x+dx,y+dy);if(map[j]===FLOOR){n++;rg=reg[j]}}

  S.L={map,bio,seen:new Array(W*H).fill(0),smoke:new Array(W*H).fill(0),spore:new Array(W*H).fill(0),fire:new Array(W*H).fill(0),light:new Uint8Array(W*H),opq:new Uint8Array(W*H),items:[],mons:[],objs:[],deco:new Uint8Array(W*H),decal:new Uint8Array(W*H),tset:bio+(S.depth%2===0?'2':'')};

  if(!boss){stairsRoom=nonC.filter(r=>r!==start).reduce((a,b)=>dm[I(b.cx,b.cy)]>dm[I(a.cx,a.cy)]?b:a);map[I(stairsRoom.cx,stairsRoom.cy)]=STAIRS}

  const nearDoor=(x,y)=>DIR8.some(([dx,dy])=>{const t=map[I(x+dx,y+dy)];return t===DOOR||t===GATE})||DIR4.some(([dx,dy])=>{const t=map[I(x+dx,y+dy)];return t===FLOOR&&!inRoom(x+dx,y+dy)});
  const obj=(type,x,y,ex)=>{const o=Object.assign({type,x,y,id:S.nextId++},ex||{});L.objs.push(o);return o};
  const inner=r=>{const c=[];for(let y=r.y+1;y<r.y+r.h-1;y++)for(let x=r.x+1;x<r.x+r.w-1;x++)c.push([x,y]);return c};
  const cells=r=>{const c=[];for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)if(map[I(x,y)]===FLOOR)c.push([x,y]);return c};
  const corners=r=>[[r.x,r.y],[r.x+r.w-1,r.y],[r.x,r.y+r.h-1],[r.x+r.w-1,r.y+r.h-1]].filter(([x,y])=>free(x,y)&&!nearDoor(x,y));
  const placeSome=(r,type,n,ex,where)=>{let k=0;for(const[x,y]of shuffle((where||cells)(r)))if(k<n&&free(x,y)&&!nearDoor(x,y)){obj(type,x,y,typeof ex==='function'?ex():ex);k++}return k};

  const blob=(r,tile,n)=>{const c=cells(r);if(!c.length)return;for(let k=0;k<n;k++){let[x,y]=pick(c);for(let s=0;s<6;s++){if(inb(x,y)&&map[I(x,y)]===FLOOR&&!nearDoor(x,y)&&!(x===start.cx&&y===start.cy))map[I(x,y)]=tile;const d=pick(DIR8);x+=d[0];y+=d[1];if(!inRoom(x,y))break}}};
  /* ---- room themes ---- */
  const themes={mine:['storage','props','crystals','plain','shrine','flooded','rails','rails','camp','collapse','chasm'],crypt:['ossuary','pillars','chapel','plain','vault','ossuary','cathedral','cathedral','chasm','collapse'],fungal:['grove','nest','pods','grove','pool','garden','garden','chasm','plain'],drowned:['flooded','pillars','chapel','plain','cistern','cistern','cathedral','drain','chasm']}[bio];
  const nests=[],flooded=new Set();let shrineDone=false;

  for(let y=2;y<15;y++)for(let x=2;x<15;x++){const i=(y*16+x)*4;if(px[i+3]&&((x*17+y*31+rows.length*7)%47===0)){g.fillStyle='rgba(235,245,218,.24)';g.fillRect(x,y,1,1)}}
  // Material pass: palette-aware pixel grain, wet highlights, and engraved seams.
  for(let y=1;y<15;y++)for(let x=1;x<15;x++){

  return`<div class="itm${extra&&extra.eq?' eq':''}"><div class="t"><img src="${ICON[gearSpr(it)]}" alt=""><div><b style="color:${it.ident===false?'var(--bone)':R.col}">${esc(itemTitle(it))}</b><div class="r" style="color:${R.col}">${R.name} ${kindName(it)} · depth ${it.d}</div></div></div>
    <ul>${lines.map(l=>`<li${l.startsWith('Curse')?' class="cur"':''}>${esc(l)}</li>`).join('')}</ul><div class="row2">${extra&&extra.price!=null?`<span class="pr">${extra.price} silver</span>`:'<span></span>'}<span style="display:flex;gap:4px">${btns||''}</span></div></div>`}
function bindCards(el,fn){el.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{fn(b.dataset.act,b.dataset.id);})}
/* ---- shops ---- */
const SUP={draught:{n:'Healing draught',p:20},charge:{n:'Blasting charge',p:25},ink:{n:'Smoke bomb',p:20},oil:{n:'Firepot',p:25},tea:{n:'Dreamless tea',p:25}};
function supplyRow(k,price,town){const have=town?((META.supplies||{})[k]||0):(S.inv[k]||0);const can=(town?META.silver:S.gold)>=price;return`<div class="itm"><div class="t"><img src="${ICON[k]}" alt=""><div><b>${SUP[k].n}</b><div class="r" style="color:var(--dim)">You have ${have}</div></div></div><ul><li>${esc(AB[k].desc)}</li></ul><div class="row2"><span class="pr">${price} silver</span><button class="btn" data-act="sup" data-id="${k}" ${can?'':'disabled'}>Buy</button></div></div>`}
function buySupply(k,price,town){if(town){if(META.silver<price)return;META.silver-=price;const s=META.supplies||(META.supplies={});s[k]=(s[k]||0)+1;saveMeta()}else{if(S.gold<price)return;S.gold-=price;S.inv[k]=(S.inv[k]||0)+1}}
let shopTab=null;
const shopObj=kind=>S.L.objs.find(o=>kind==='silas'?o.type==='rival':o.type==='merchant'&&o.who===kind);
UI.shop=(kind,tab)=>{const town=!!(S.L&&S.L.town);shopTab=tab||shopTab;const mmul=kind==='rook'?1.3:kind==='silas'?1.15:0.9;
  const N={smith:'tobias',chapel:'agathe',tavern:'bram',hall:'hale',apoth:'nell',rook:'rook',peddler:'peddler',silas:'silas'}[kind];const NP=NPCS[N];
  let body='',tabs=[];const T=(id,l)=>{tabs.push([id,l]);return shopTab===id};
  if(kind==='smith'){if(!META.smith){META.smith=[0,1,2,3].map(()=>{const it=genWeapon(Math.max(1,META.deepest+1),pick(['worn','fine','fine','storied']));it.ident=true;return it});saveMeta()}
    if(!['buy','sell','forge','kits'].includes(shopTab))shopTab='buy';T('buy','Buy');T('kits','Kits');T('sell','Sell');T('forge',flag('pipFreed')?'Reforge':'Reforge (needs Pip)');
    if(shopTab==='buy')body=`<div class="cards">${META.smith.map(it=>card(it,`<button class="btn" data-act="buy" data-id="${it.id}" ${META.silver>=Math.round(it.value*1.5)?'':'disabled'}>Buy</button>`,{price:Math.round(it.value*1.5)})).join('')||'<p class="purse">Sold out until your next return.</p>'}</div>`;
    if(shopTab==='kits')body=`<div class="cards">${Object.entries(KITS).map(([k,K])=>`<div class="itm${(META.kits||{})[k]?' eq':''}"><div class="t"><div><b>${K.name}</b><div class="r" style="color:var(--dim)">Kit · choose one at the lift head</div></div></div><ul><li>${esc(K.desc)}</li></ul><div class="row2"><span class="pr">${(META.kits||{})[k]?'Owned':K.cost+' silver'}</span>${(META.kits||{})[k]?'':`<button class="btn" data-act="kit" data-id="${k}" ${META.silver>=K.cost?'':'disabled'}>Buy</button>`}</div></div>`).join('')}</div><p class="purse">Kits are armour and harness that change how a delver fights. You own them for good.</p>`;
    if(shopTab==='sell')body=stashCards(it=>it.kind==='weapon'||it.kind==='armor',it=>`<button class="btn" data-act="sell" data-id="${it.id}">Sell ${Math.round(it.value*0.5)}</button>`);
    if(shopTab==='forge')body=flag('pipFreed')?stashCards(it=>it.kind==='weapon',it=>`<button class="btn" data-act="reforge" data-id="${it.id}" ${META.silver>=60?'':'disabled'}>Reforge 60</button>${it.curse?`<button class="btn" data-act="cleanse" data-id="${it.id}" ${META.silver>=80?'':'disabled'}>Cleanse 80</button>`:''}`)+'<p class="purse">Reforging rerolls every property, keeping the rarity. Cleansing strips the curse and the strongest property with it.</p>':'<p class="say">"Bring Pip home," Tobias says, "and we\'ll talk about what the forge can really do."</p>'}
  if(kind==='chapel'){if(!['bless','read'].includes(shopTab))shopTab='bless';T('bless','Blessings');T('read','Readings');
    if(shopTab==='bless')body=`<div class="cards">${Object.entries(BLESS).map(([k,b])=>`<div class="itm${META.pendingBless===k?' eq':''}"><div class="t"><div><b>${b.name}</b><div class="r" style="color:var(--dim)">Lasts one delve</div></div></div><ul><li>${esc(b.desc)}</li></ul><div class="row2"><span class="pr">${b.cost} silver</span>${META.pendingBless===k?'<span class="purse">Blessed for your next delve</span>':`<button class="btn" data-act="bless" data-id="${k}" ${META.silver>=b.cost&&!META.pendingBless?'':'disabled'}>Receive</button>`}</div></div>`).join('')}</div><p class="purse">One blessing at a time. It takes hold when you next ride the lift.</p>`;
    if(shopTab==='read')body=stashCards(it=>it.ident===false,it=>`<button class="btn" data-act="ident" data-id="${it.id}" ${META.silver>=15?'':'disabled'}>Read it · 15</button>`,'Nothing in your cottage needs reading. Agathe reads unidentified weapons so their curses show before you trust them.')}
  if(kind==='tavern'){if(!['sup','sell'].includes(shopTab))shopTab='sup';T('sup','Supplies');T('sell','Sell loot');
    if(shopTab==='sup')body=`<div class="cards">${['draught','charge','ink','oil'].map(k=>supplyRow(k,SUP[k].p,true)).join('')}</div><p class="purse">Supplies go in your cottage and come down with you on your next delve.</p>`;
    if(shopTab==='sell')body=stashCards(()=>true,it=>`<button class="btn" data-act="sell" data-id="${it.id}">Sell ${Math.round(it.value*0.45)}</button>`)}
  if(kind==='apoth'){shopTab='sup';T('sup','Remedies');body=`<div class="cards">${supplyRow('tea',25,true)}${supplyRow('draught',15,true)}</div>`}
  if(kind==='hall'){shopTab='up';T('up','Guild training');body=`<div class="cards">${Object.entries(UPGRADES).map(([k,u])=>{const r=META.upg[k]||0,c=u.cost[r];return`<div class="itm${r>=u.max?' eq':''}"><div class="t"><div><b>${u.name}</b><div class="r" style="color:var(--dim)">Rank ${r} of ${u.max}</div></div></div><ul><li>${esc(u.desc)}</li></ul><div class="row2"><span class="pr">${r<u.max?c+' silver':'Mastered'}</span>${r<u.max?`<button class="btn" data-act="up" data-id="${k}" ${META.silver>=c?'':'disabled'}>Train</button>`:''}</div></div>`}).join('')}</div>`}
  if(kind==='rook'||kind==='peddler'||kind==='silas'){const o=shopObj(kind);if(o&&!o.stock){o.stock=kind==='rook'||kind==='silas'?[rollGear(10),rollGear(5)].map(it=>{it.ident=true;return it}):[rollGear(0)]}
    if(!['buy','sup','sell'].includes(shopTab))shopTab='buy';T('buy','Wares');T('sup','Supplies');T('sell','Sell');
    if(shopTab==='buy')body=`<div class="cards">${(o&&o.stock||[]).map(it=>card(it,`<button class="btn" data-act="mbuy" data-id="${it.id}" ${S.gold>=Math.round(it.value*mmul)?'':'disabled'}>Buy</button>`,{price:Math.round(it.value*mmul)})).join('')||'<p class="purse">Nothing left.</p>'}</div>`;
    if(shopTab==='sup')body=`<div class="cards">${['draught','charge','ink','oil'].map(k=>supplyRow(k,Math.round(SUP[k].p*(kind==='rook'?1.4:kind==='peddler'?0.8:1)),false)).join('')}</div>`;
    if(shopTab==='sell')body=`<div class="cards">${S.bag.map(it=>card(it,`<button class="btn" data-act="msell" data-id="${it.id}">Sell ${Math.round(it.value*(kind==='rook'?0.6:0.35))}</button>`)).join('')||'<p class="purse">Your pack holds nothing to sell. Unequip gear first.</p>'}</div>`}
  const el=modal(`${head(ICON_N(NP.spr),NP.name,NP.role)}<div class="row" style="align-items:center"><div class="tabs">${tabs.map(([id,l])=>`<button class="btn${shopTab===id?' on':''}" data-tab="${id}">${l}</button>`).join('')}</div>${purse()}</div>${body}`,true);
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>UI.shop(kind,b.dataset.tab));
  bindCards(el,(a,id)=>{const st=META.stash;const fi=()=>st.findIndex(i=>i.id===id);
    if(a==='buy'){const i=META.smith.findIndex(x=>x.id===id),it=META.smith[i],p=Math.round(it.value*1.5);if(META.silver>=p){META.silver-=p;META.smith.splice(i,1);st.push(it)}}
    if(a==='sell'){const i=fi();if(i>=0){const it=st[i];META.silver+=Math.round(it.value*(kind==='smith'?0.5:0.45));st.splice(i,1)}}
    if(a==='reforge'){const i=fi();if(i>=0&&META.silver>=60){META.silver-=60;const o0=st[i];const n=genWeapon(o0.d,o0.rar,o0.base);n.ident=true;st[i]=n;log(`Pip reworks the steel. It is now ${n.name}.`,'gold')}}
    if(a==='cleanse'){const i=fi();if(i>=0&&META.silver>=80){META.silver-=80;const it=st[i];it.curse=null;const top=Object.keys(it.aff).sort((x,y)=>it.aff[y]*AFFIX[y].cost-it.aff[x]*AFFIX[x].cost)[0];if(top){it.aff[top]--;if(!it.aff[top])delete it.aff[top]}it.value=itemValue(it)}}
    if(a==='kit'){const K=KITS[id];if(META.silver>=K.cost){META.silver-=K.cost;META.kits=META.kits||{};META.kits[id]=1}}
    if(a==='bless'){const b=BLESS[id];if(META.silver>=b.cost&&!META.pendingBless){META.silver-=b.cost;META.pendingBless=id}}
    if(a==='ident'){const i=fi();if(i>=0&&META.silver>=15){META.silver-=15;st[i].ident=true}}
    if(a==='up'){const u=UPGRADES[id],r=META.upg[id]||0;if(r<u.max&&META.silver>=u.cost[r]){META.silver-=u.cost[r];META.upg[id]=r+1}}
    if(a==='sup'){const p=kind==='rook'?Math.round(SUP[id].p*1.4):kind==='peddler'?Math.round(SUP[id].p*0.8):kind==='apoth'&&id==='draught'?15:SUP[id].p;buySupply(id,p,town)}
    if(a==='mbuy'){const o=shopObj(kind);if(!o||!o.stock)return;const i=o.stock.findIndex(x=>x.id===id),it=o.stock[i],p=Math.round(it.value*mmul);if(S.gold>=p){S.gold-=p;o.stock.splice(i,1);S.bag.push(it)}}
    if(a==='msell'){const i=S.bag.findIndex(x=>x.id===id);if(i>=0){S.gold+=Math.round(S.bag[i].value*(kind==='rook'?0.6:0.35));S.bag.splice(i,1)}}
    saveMeta();UI.save();UI.shop(kind,shopTab)})};
function stashCards(filter,btns,empty){const list=META.stash.filter(filter);return`<div class="cards">${list.map(it=>card(it,btns(it))).join('')||`<p class="purse">${empty||'You carry nothing you could sell.'}</p>`}</div>`}
/* ---- cottage, archive, journal ---- */
UI.cottage=()=>{const el=modal(`${head(null,'Your Cottage','A cold room above the cobbler\'s, rented by the council')}<div class="row"><span class="purse">Banked silver <b>${META.silver}</b> · supplies: ${Object.entries(META.supplies||{}).filter(([k,v])=>v).map(([k,v])=>`${v} ${SUP[k].n.toLowerCase()}${v>1?'s':''}`).join(', ')||'none'}</span><span class="purse">Delves ${META.runs} · deaths ${META.deaths}</span></div>
  <p class="sect">What you carry</p>${stashCards(()=>true,it=>`<button class="btn" data-act="drop" data-id="${it.id}">Discard</button>`,'Nothing. Gear you bring up stays on your delver, and goes down with them next time.')}<p class="purse">Nothing is kept here for a dead delver. If you die, what you carry stays in the deep. Only banked silver, kits and what you have learned survive you.</p>`,true);
  bindCards(el,(a,id)=>{if(a==='drop'){const i=META.stash.findIndex(x=>x.id===id);if(i>=0)META.stash.splice(i,1);saveMeta();UI.cottage()}})};
UI.archive=tab=>{tab=tab||'beasts';const seenK=Object.keys(META.bestiary).filter(k=>MON[k]);let body='';
  if(tab==='beasts')body=`<div class="cards">${seenK.map(k=>{const b=META.bestiary[k],M=MON[k];return`<div class="itm"><div class="t"><img src="${monIcon(k)}" alt=""><div><b>${esc(M.title||M.name.replace(/^./,c=>c.toUpperCase()))}</b><div class="r" style="color:var(--dim)">${AI_TXT[M.ai]} · slain ${b.kills}</div></div></div><ul><li>${esc(M.desc)}</li>${b.kills>=2&&M.weak?`<li>Weak to ${M.weak.join(', ')}</li>`:''}${b.kills>=2&&M.resist?`<li>Resists ${M.resist.join(', ')}</li>`:''}${b.kills<2?'<li>Slay two to learn its weaknesses.</li>':''}</ul></div>`}).join('')||'<p class="purse">Nothing recorded yet. Creatures you see below are written here.</p>'}</div>`;
  else body=`<div class="lore" style="max-height:min(56vh,480px);overflow-y:auto">${LORE.map((L0,i)=>META.lore[i]?`<h4>${esc(L0.t)}</h4><p>${esc(L0.x)}</p>`:`<h4 style="color:var(--dim)">A missing page</h4><p style="color:var(--dim)">Somewhere ${L0.d<=2?'in the Salt Mines':L0.d<=4?'in the Bone Crypts':L0.d<=6?'in the Fungal Hollows':'in the Drowned Vaults'}.</p>`).join('')}</div>`;
  const el=modal(`${head(null,'The Old Archive','Dust, wax, and the Brotherhood\'s ledgers')}<div class="tabs"><button class="btn${tab==='beasts'?' on':''}" data-tab="beasts">Bestiary (${seenK.length})</button><button class="btn${tab==='lore'?' on':''}" data-tab="lore">Pages (${Object.keys(META.lore).length}/${LORE.length})</button></div>${body}`,true);
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>UI.archive(b.dataset.tab))};
UI.journal=()=>{const q=Object.entries(QUESTS).filter(([k])=>META.story.q[k]);
  modal(`${head(null,'Journal',`Act ${act()} of 4`)}${q.length?q.map(([k,Q])=>{const done=META.story.q[k]==='done';return`<div class="qst"><b class="${done?'dn':''}">${Q.name}${done?' · done':''}</b>${Q.steps.map(([f,t])=>`<span class="${flag(f)||done?'dn':'td'}">${flag(f)||done?'✓':'·'} ${esc(t)}</span>`).join('')}</div>`}).join(''):'<p class="purse">No tasks yet. Talk to the people of Saltmarrow.</p>'}
  <div class="qst"><b>Trust</b>${Object.keys(META.story.trust).filter(k=>META.story.seen[k]).map(k=>`<span class="td">${NPCS[k].name}: ${tr(k)>=3?'trusts you':tr(k)>=1?'warming to you':tr(k)<=-2?'wary of you':'uncertain'}</span>`).join('')||'<span class="td">You have met no one yet.</span>'}</div>`)};
/* ---- the lift ---- */
let liftSel=null;
UI.lift=()=>{if(!(S.L&&S.L.town)){return}const ds=startDepths();if(!liftSel)liftSel={cls:(META.hero&&CLASSES[META.hero])?META.hero:(classOpen(S.cls)?S.cls:'riptide'),d:ds[ds.length-1],items:[]};
  liftSel.items=liftSel.items.filter(id=>META.stash.some(i=>i.id===id));
  const cl=Object.entries(CLASSES).map(([k,c])=>{const open=classOpen(k);return`<button class="itm${liftSel.cls===k?' eq':''}${open?'':' lock'}" data-cls="${k}" ${open?'':'disabled'} style="text-align:left;cursor:${open?'pointer':'default'}"><div class="t"><img src="${ICON[c.spr]}" alt=""><div><b>${c.name}</b><div class="r" style="color:var(--dim)">${c.role} · ${c.res}</div></div></div><ul><li>${esc(open?c.blurb:CLASS_UNLOCK[k].txt)}</li>${open?`<li>${esc(c.passive)}</li>`:''}</ul></button>`}).join('');
  const gear=META.stash.filter(i=>i.kind!=='x');const rSel=liftSel.items.filter(id=>{const i=META.stash.find(x=>x.id===id);return i&&i.kind==='relic'}).length;liftSel.omens=liftSel.omens||[];
  const kits=Object.keys(META.kits||{});if(liftSel.kit&&!kits.includes(liftSel.kit))liftSel.kit=null;const wSel=liftSel.items.filter(id=>{const i=META.stash.find(x=>x.id===id);return i&&i.kind==='weapon'}).length,tSel=liftSel.items.filter(id=>{const i=META.stash.find(x=>x.id===id);return i&&i.kind==='tome'}).length;const aSel=sl=>liftSel.items.filter(id=>{const i=META.stash.find(x=>x.id===id);return i&&i.kind==='armor'&&i.slot===sl}).length;
  const el=modal(`${head(ICON_N('n_mara'),'The Lift Head','Choose who goes down, how deep, and what they carry')}
    <p class="purse">Going down: <b>${CLASSES[liftSel.cls].name}</b>, ${CLASSES[liftSel.cls].role.toLowerCase()}.</p>
    <p class="sect">Depth</p><div class="tabs">${ds.map(d=>`<button class="btn${liftSel.d===d?' on':''}" data-d="${d}">Depth ${d} · ${BIOMES[biomeOf(d)].name}${d>1?` (start at level ${1+Math.floor((d-1)/2)})`:''}</button>`).join('')}</div>
    ${kits.length?`<p class="sect">Kit</p><div class="tabs"><button class="btn${!liftSel.kit?' on':''}" data-kit="">None</button>${kits.map(k=>`<button class="btn${liftSel.kit===k?' on':''}" data-kit="${k}" title="${esc(KITS[k].desc)}">${KITS[k].name}</button>`).join('')}</div>`:''}
    ${omensOpen()?`<p class="sect">Omens (harder delves, more silver)</p><div class="tabs">${Object.entries(OMENS).map(([k,O])=>`<button class="btn${liftSel.omens.includes(k)?' on':''}" data-omen="${k}" title="${esc(O.desc)}">${O.name} ×${O.mul}</button>`).join('')}</div>`:''}
    <p class="sect">What your delver carries</p>${gear.length?`<p class="purse">Everything below goes down with you. If you die, it is gone for good.</p><div class="cards">${gear.map(it=>card(it,'',{eq:carryEqd(it)})).join('')}</div>`:'<p class="purse">Nothing but bare hands and your class training. Whatever you find down there is yours until you die.</p>'}
    <div class="row" style="align-items:center;flex-wrap:wrap;gap:10px"><span class="purse">${META.pendingBless?`Blessed: <b>${BLESS[META.pendingBless].name}</b> · `:''}Supplies: ${1+META.upg.prov+((META.supplies||{}).draught||0)} draughts, ${1+((META.supplies||{}).charge||0)} charges, ${1+((META.supplies||{}).ink||0)} smoke, ${1+((META.supplies||{}).oil||0)} firepots${(META.supplies||{}).tea?`, ${META.supplies.tea} tea`:''}</span><button class="btn primary" id="goDown">Ride the lift down</button></div>`,true);
  el.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{liftSel.cls=b.dataset.cls;UI.lift()});el.querySelectorAll('[data-kit]').forEach(b=>b.onclick=()=>{liftSel.kit=b.dataset.kit||null;UI.lift()});el.querySelectorAll('[data-omen]').forEach(b=>b.onclick=()=>{const k=b.dataset.omen,i=liftSel.omens.indexOf(k);if(i>=0)liftSel.omens.splice(i,1);else liftSel.omens.push(k);UI.lift()});el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{liftSel.d=+b.dataset.d;UI.lift()});
  bindCards(el,(a,id)=>{const i=liftSel.items.indexOf(id);if(i>=0)liftSel.items.splice(i,1);else liftSel.items.push(id);UI.lift()});
  $('goDown').onclick=()=>{const L0=liftSel;const bless=META.pendingBless;META.pendingBless=null;liftSel=null;ov.hidden=true;newRun(L0.cls,L0.d,{items:carryOrder(),bless,kit:L0.kit,omens:L0.omens});if(S.gear.tomes.length)for(const t of S.gear.tomes)if(!t.read){t.read=1;META.tomeReads++}saveMeta();camInit=false;UI.render()}};
/* ---- gear in the dungeon ---- */
UI.gear=()=>{if(S.L&&S.L.town){UI.cottage();return}const w=S.gear.weapon,tm=S.gear.tomes,inC=S.mode==='combat';
  const el=modal(`${head(ICON[S.cls],'Gear',inC?'You cannot change gear mid-fight':'Equip, swap or drop what you carry')}
    <p class="sect">Equipped</p><div class="cards" style="max-height:none">${S.gear.relic?card(S.gear.relic,inC?'':`<button class="btn" data-act="unr" data-id="${S.gear.relic.id}">Unequip</button>`,{eq:1}):''}${w?card(w,inC?'':`<button class="btn" data-act="unw" data-id="${w.id}">Unequip</button>`,{eq:1}):'<div class="itm"><b>No weapon</b><ul><li>Bare hands and class training.</li></ul></div>'}${tm.map(t=>card(t,inC?'':`<button class="btn" data-act="unt" data-id="${t.id}">Unequip</button>`,{eq:1})).join('')}</div>
    <p class="sect">Pack</p><div class="cards">${S.bag.map(it=>card(it,inC?'':`<button class="btn primary" data-act="eq" data-id="${it.id}">Equip</button><button class="btn" data-act="drop" data-id="${it.id}">Drop</button>`)).join('')||'<p class="purse">Nothing in your pack.</p>'}</div>`,true);
  bindCards(el,(a,id)=>{if(inC)return;const bi=S.bag.findIndex(x=>x.id===id);
    if(a==='unr'&&S.gear.relic){S.bag.push(S.gear.relic);S.gear.relic=null}

  const cv2=$('campCv'),g=cv2.getContext('2d'),zEl=$('kzone'),mk=$('kmark'),msg=$('kmsg');const place=()=>{zEl.style.left=(zone*100)+'%';zEl.style.width=(zw*100)+'%'};place();

    g.fillStyle='#3a2a1a';for(const[x,y,w,h,a]of[[W2/2-34,H2-30,68,9,0.25],[W2/2-30,H2-28,60,9,-0.3]]){g.save();g.translate(x+w/2,y+h/2);g.rotate(a);g.fillRect(-w/2,-h/2,w,h);g.restore()}
    for(let k=0;k<6;k++){g.fillStyle=['#4a4a50','#5a5a60','#3a3a40'][k%3];g.fillRect(W2/2-46+k*16,H2-20,12,8)}
    if(hits>0){for(let k=0;k<3+hits*3;k++){const s=hits;const h=(14+Math.sin(now/90+k*1.7)*6)*s*0.7,w=(10-k%3*3)*(0.6+s*0.2);const fx=W2/2+(k-(3+hits*3)/2)*4+Math.sin(now/140+k)*3;g.fillStyle=['#c2533e','#ff8a3a','#ffd36b','#fff2b0'][k%4];g.fillRect(fx-w/2,H2-34-h,w,h)}}
    for(const p of sparks){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.l--;g.fillStyle=p.l>10?'#fff2b0':'#ff8a3a';g.fillRect(p.x,p.y,2,2)}for(let i=sparks.length-1;i>=0;i--)if(sparks[i].l<=0)sparks.splice(i,1);
    if(!done)mk.style.left=(pos()*100)+'%';raf=requestAnimationFrame(drawFire)};drawFire();
  const kh=ev=>{if(ev.key===' '||ev.key==='Enter'){ev.preventDefault();const b=$('strike');if(b)b.click()}};document.addEventListener('keydown',kh);

    speed*=1.25;zone=0.08+Math.random()*0.7;zw=Math.max(0.12,zw-0.03);place();if(tries>=3)finish()}};

    <section><h3>Keys</h3><dl><dt>WASD · arrows</dt><dd>Move (QEZC diagonals)</dd><dt>1–5</dt><dd>Class abilities</dd><dt>6 7 8 9 0</dt><dd>Shift, shove, hide, defend, dash</dd><dt>R X V F</dt><dd>Draught, charge, smoke bomb, firepot</dd><dt>T · B · L</dt><dd>Toss stone, catch breath, lantern</dd><dt>Space</dt><dd>End turn (or wait)</dd><dt>Tab · Enter · Esc</dt><dd>Cycle, confirm, cancel targets</dd><dt>&gt;</dt><dd>Descend stairs</dd></dl></section>
    <section><h3>Combat</h3><p>Exploring happens in real time: enemies patrol and notice you on their own. The moment a fight starts, the game becomes turn-based until it ends. (You can switch exploring to turn-based in the menu.)</p><p>Each turn you get a <b>move</b>, a <b>maneuver</b> and a <b>main action</b>. Attacks roll 2d10 + a characteristic: 11 or less is tier 1, 12–16 tier 2, 17+ tier 3. Edges add 2, banes subtract 2; a double edge or bane shifts the tier. A natural 19–20 is a critical and gives you another main action.</p><p>Walking away from an adjacent enemy gives it a free strike. <b>Shift</b> to step away safely. Push foes into walls, carts, props, fire and shafts for extra damage.</p><p>Your heroic resource builds each turn. Winning fights adds <b>Victories</b>, which start you with more. Catch your breath with Recoveries.</p></section>
    <section><h3>Sneaking</h3><p>Attack an enemy that hasn't noticed you for a <b>sneak attack</b>: double damage (triple for the Cutpurse). Kill it outright and nobody else knows: no fight starts, and you earn half again the XP. If it survives, the fight begins with you acting first.</p><p>The bar over a suspicious enemy's head fills as it watches you. In shadow with your lantern shuttered it fills more slowly. The eye chip on the map tells you how exposed you are.</p><p>The Cutpurse can pick pockets (hold or right-click an unaware enemy next to you) and <b>Shadowstep</b> to an unlit square nearby.</p></section>
    <section><h3>Survival</h3><p><b>Fatigue</b> builds as you explore and fight. Weary (60+) gives a bane on your rolls; exhausted (85+) gives two and slows you.</p><p><b>Make camp</b> (K) once per level when nothing is hunting you. Strike a flint to light the fire, choose two things to do, then face whatever comes in the night. A bigger fire rests you better but draws attention. Rations make for a proper meal.</p><p>Between the mines, crypts, hollows and vaults lies a <b>long descent</b>: a journey of several legs, each resolved with a 2d10 test. Some levels have an old side passage that skips a level the hard way. What happens on the road follows you: failures bring trouble (something tracks you down, the braziers are cold, the level knows you are coming), triumphs bring help (a supply cache, the map scouted, an unseen arrival).</p><p>Search crates, lockers, urns, sacks, reliquaries, shelves, barrels and bodies by walking into them. Urns are loud to break, and some sacks have something living in them.</p></section>
    <section><h3>Living levels</h3><p>Most levels have a <b>situation</b> shown at the top of the map: a ritual to break (kill the celebrants or snuff the candles), a marked beast to hunt, a vault needing three keys, a flood to stop at its valve, or a cave-in to brace with the old jack.</p><p><b>Traps</b> hide on plates and tripwires. You may spot them as you pass (Intuition and an open lantern help; the Cutpurse spots most). Step around them, disarm them, or lure enemies across. <b>Rotten floors</b> give way a moment after something heavy steps on them.</p><p><b>Firedamp</b> pockets explode from any spark, <b>oil</b> burns in sheets, <b>chandeliers</b> come down on a thrown stone, <b>sluices</b> flood rooms, and <b>boulders</b> roll down long tunnels. Monster factions hate each other: make noise near rival groups and let them fight.</p><p><b>Secret rooms</b> hide behind thick walls. A cold draught, a knock on the wall (hold or right-click it) or a miner's note gives them away. Blast through with charges (one per layer of rock), dig with a pick, or solve the lever and brazier puzzles: their plaques give the order.</p><p>You will meet <b>people and things</b> down there. Choices are rolled like journeys.</p></section>
    <section><h3>Combat tells and growth</h3><p>On your turn, a badge over each enemy shows what it will do next and roughly how much it will hurt. A sapper that lights a fuse marks where the bomb will land, so get out of the squares.</p><p>Each level-up lets you choose one of three perks. At levels 2, 3 and 5 you also <b>learn a new move</b> from your class's pool: pick one of two. Learned moves sit at the end of your bar and fire with Shift+1, Shift+2 and Shift+3. <b>Explore</b> (O) walks you to the next unexplored spot and stops the moment anything stirs.</p></section>
    <section><h3>Stealth and the world</h3><p>Red cones show where enemies are looking. Your open lantern lets you see far but makes you easy to spot. Light from braziers and fires gives you away; tall growth, smoke and water hide you.</p><p>Toss stones to lure guards, shatter crystals for a big distraction, douse braziers to darken a room. Blast cracked walls and gates, bring timber props down on enemies, roll carts into them, burn webs and growth.</p><p>Wolves hunt in packs and surround you. Archers back away. Cultists heal their friends. Ghouls eat corpses. Learn them by inspecting.</p></section>

/* ---------- voices & foley: spatial monster noises, footsteps, doors, varied attacks, hero chatter ---------- */
// spatial output: volume falls off with distance, panned left/right of the hero
function spOut(x,y,base,range){if(!AU.on||!AU.ctx)return null;const C=AU.ctx;let v=1,p=0;
  if(x!=null&&S&&S.P){const dx=x-S.P.x,dy=y-S.P.y,d=Math.hypot(dx,dy),R=range||14;v=Math.max(0,1-d/R);v=v*v;p=Math.max(-0.85,Math.min(0.85,dx/9))}
  v*=(base==null?1:base);if(v<0.012)return null;const g=C.createGain();g.gain.value=v;
  if(C.createStereoPanner){const pn=C.createStereoPanner();pn.pan.value=p;g.connect(pn);pn.connect(AU.m);setTimeout(()=>{try{g.disconnect();pn.disconnect()}catch(e){}},5000)}else{g.connect(AU.m);setTimeout(()=>{try{g.disconnect()}catch(e){}},5000)}
  return g}

  os.frequency.setValueAtTime(o.f0,t);if(o.fm)os.frequency.exponentialRampToValueAtTime(o.fm,t+dur*0.45);os.frequency.exponentialRampToValueAtTime(o.f1||o.f0,t+dur);
  if(o.vib){const l=C.createOscillator(),lg=C.createGain();l.frequency.value=o.vibR||6;lg.gain.value=o.vib*o.f0;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.1)}
  let src=os;if(o.trem){const tg=C.createGain();tg.gain.value=1-o.trem;const l=C.createOscillator(),lg=C.createGain();l.type='square';l.frequency.value=o.tremR||30;lg.gain.value=o.trem;l.connect(lg);lg.connect(tg.gain);os.connect(tg);src=tg;l.start(t);l.stop(t+dur+0.1)}
  const eg=C.createGain();eg.connect(dest);const fs=o.form||[700,1150];for(const f of fs){const b=C.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=o.q||5;src.connect(b);b.connect(eg)}
  const pk=o.peak||0.1,a=o.a||0.03;eg.gain.setValueAtTime(0.0001,t);eg.gain.exponentialRampToValueAtTime(pk,t+a);eg.gain.setValueAtTime(pk,t+Math.max(a,dur*0.6));eg.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  os.start(t);os.stop(t+dur+0.1)}
function nz(dest,o){if(!dest)return;const C=AU.ctx,t=C.currentTime+(o.when||0),dur=o.dur||0.1;const s=C.createBufferSource();s.buffer=AU.noise;const b=C.createBiquadFilter();b.type=o.hp?'highpass':o.lp?'lowpass':'bandpass';
  b.frequency.setValueAtTime(o.f,t);if(o.f1)b.frequency.exponentialRampToValueAtTime(o.f1,t+dur);b.Q.value=o.q||1;const g=C.createGain();s.connect(b);b.connect(g);g.connect(dest);
  const pk=o.peak||0.1,a=o.a||0.004;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);s.start(t,Math.random()*1.5);s.stop(t+a+dur+0.1)}
function tn(dest,f,type,pk,dur,when,f1){if(!dest)return;const C=AU.ctx,t=C.currentTime+(when||0);const o=C.createOscillator(),g=C.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);o.connect(g);g.connect(dest);

/* --- footsteps by surface, alternating feet --- */
let footL=false;

  if(t===BONES){for(let k=0;k<3;k++)nz(d,{f:jit(2800),q:5,peak:0.06,dur:0.03,when:k*0.03});return}

  if(L.town){nz(d,{f:jit(380*lr),q:1.5,peak:0.06,dur:0.06});nz(d,{f:5000,hp:true,q:0.6,peak:0.012,dur:0.15});return}
  const b=L.bio==='fungal'?200:L.bio==='drowned'?300:L.bio==='crypt'?520:420;nz(d,{f:jit(b*lr,0.08),q:1.8,peak:L.bio==='fungal'?0.05:0.07,dur:0.05});nz(d,{f:jit(2400),q:3,peak:0.012,dur:0.03,when:0.015});

      else{tn(d,jit(500),'sine',0.03,0.4,0,jit(900))}break}
