name: Carrion Brood regression
on:
  pull_request:
    paths: ['index.html', 'carrion-*.js', 'assets/carrion-brood/**', 'tests/**', 'sw.js', '.github/workflows/carrion.yml']
  push:
    branches: [main]
    paths: ['index.html', 'carrion-*.js', 'assets/carrion-brood/**', 'tests/**', 'sw.js', '.github/workflows/carrion.yml']
jobs:
  carrion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:carrion
        env:
          SCREENSHOT_DIR: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrion-screenshots
          path: test-results
