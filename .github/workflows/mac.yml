name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-app/**'
      - '.github/workflows/mac.yml'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Bundle the game (offline fallback) and icon
        working-directory: desktop-app
        run: |
          mkdir -p www
          cp ../index.html ../death-effects.js ../drowned-sprites.js ../hollow-faith.js ../hollow-sprites.js ../flat-art.js ../sw.js ../manifest.webmanifest ../icon-192.png ../icon-512.png ../icon-maskable-512.png ../apple-touch-icon.png www/
          cp -R ../assets www/assets
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s ../icon-512.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 512 ] && sips -z $d $d ../icon-512.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          cp ../icon-512.png icon.iconset/icon_256x256@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build app (Apple Silicon + Intel)
        working-directory: desktop-app
        run: |
          npm install
          npx electron-packager . "Saltmarrow Deep" --platform=darwin --arch=universal --icon=icon.icns \
            --app-bundle-id=com.alemeno.saltmarrow --app-category-type=public.app-category.role-playing-games \
            --ignore="^/icon\.iconset" --out=dist --overwrite
          APP="dist/Saltmarrow Deep-darwin-universal/Saltmarrow Deep.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Saltmarrow Deep" -srcfolder dmg -ov -format UDZO SaltmarrowDeep.dmg

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac
          name: Saltmarrow Deep for Mac
          make_latest: false
          body: |
            Open SaltmarrowDeep.dmg and drag Saltmarrow Deep into Applications. The app loads the latest game from GitHub Pages, so game updates arrive without reinstalling.
          files: desktop-app/SaltmarrowDeep.dmg
