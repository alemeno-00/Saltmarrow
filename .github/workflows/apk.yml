name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android-app/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Bundle the game (offline fallback)
        working-directory: android-app
        run: |
          mkdir -p www
          cp ../index.html ../death-effects.js ../drowned-sprites.js ../hollow-faith.js ../hollow-sprites.js ../flat-art.js ../animation-art.js ../miner-body.js ../room-composition.js ../biome-art.js ../weapon-art.js ../environment-art.js ../environment-surfaces.js ../environment-scenes.js ../environment-lighting.js ../sw.js ../manifest.webmanifest ../icon-192.png ../icon-512.png ../icon-maskable-512.png ../apple-touch-icon.png www/
          cp -R ../assets www/assets

      - name: Create Android project
        working-directory: android-app
        run: |
          npm install
          npx cap add android
          cp MainActivity.java android/app/src/main/java/com/alemeno/saltmarrow/MainActivity.java

      - name: App icons
        working-directory: android-app
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          rm -f $R/mipmap-*/ic_launcher_foreground.png
          cp -r res/. $R/

      - name: Sync and build
        working-directory: android-app
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign
        working-directory: android-app
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -f -p 4 $IN aligned.apk
          $BT/apksigner sign --ks saltmarrow.keystore --ks-pass pass:saltmarrow --key-pass pass:saltmarrow --ks-key-alias saltmarrow --out SaltmarrowDeep.apk aligned.apk
          $BT/apksigner verify SaltmarrowDeep.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Saltmarrow Deep for Android
          make_latest: true
          body: |
            Install SaltmarrowDeep.apk on your phone. The app loads the latest game from GitHub Pages, so game updates arrive without reinstalling.
          files: android-app/SaltmarrowDeep.apk
