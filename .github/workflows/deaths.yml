name: Contextual death regression
on:
  pull_request:
    paths: ['index.html', 'death-effects.js', 'sw.js', 'tests/deaths*', '.github/workflows/deaths.yml']
  push:
    branches: [main]
    paths: ['index.html', 'death-effects.js', 'sw.js', 'tests/deaths*', '.github/workflows/deaths.yml']
jobs:
  deaths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/deaths.test.cjs
      - run: node tests/deaths-browser.cjs
        env:
          SCREENSHOT_DIR: test-results/deaths
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: death-effects-screenshots
          path: test-results/deaths
