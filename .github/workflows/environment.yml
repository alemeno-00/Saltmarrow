name: Desktop environment art
on:
  pull_request:
    paths: ['index.html', 'environment-*.js', 'room-composition.js', 'assets/flat/room-focals.webp', 'tests/rooms*', 'assets/flat/workyards.webp', 'sw.js', 'tests/environment*', 'tests/town-layout*', 'tests/lighting*', '.github/workflows/environment.yml']
  push:
    branches: [main]
    paths: ['index.html', 'environment-*.js', 'room-composition.js', 'assets/flat/room-focals.webp', 'tests/rooms*', 'assets/flat/workyards.webp', 'sw.js', 'tests/environment*', 'tests/town-layout*', 'tests/lighting*', '.github/workflows/environment.yml']
jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node --test tests/environment*.test.cjs tests/town-layout.test.cjs tests/lighting.test.cjs tests/rooms.test.cjs
      - run: node tests/environment-browser.cjs
        env:
          SCREENSHOT_DIR: artifacts/environment
      - run: node tests/lighting-browser.cjs
        env:
          SCREENSHOT_DIR: artifacts/lighting
      - run: node tests/rooms-browser.cjs
        env:
          SCREENSHOT_DIR: artifacts/rooms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-environment-comparisons
          path: artifacts
