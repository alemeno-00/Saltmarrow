name: Renderer and gameplay regression
on:
  pull_request:
    paths: ['index.html', 'isometric-art.js', 'assets/art/**', 'sw.js', 'tests/**', 'package*.json', '.github/workflows/renderer.yml']
  push:
    branches: [main]
    paths: ['index.html', 'isometric-art.js', 'assets/art/**', 'sw.js', 'tests/**', 'package*.json', '.github/workflows/renderer.yml']
jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Select test browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium --only-shell
          fi
      - run: npm test
      - run: node tests/home-browser.cjs
        env:
          SCREENSHOT_DIR: test-results
      - run: node tests/art-browser.cjs
        env:
          SCREENSHOT_DIR: test-results
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-screenshots
          path: test-results
