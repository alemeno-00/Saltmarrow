name: Renderer and gameplay regression
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'tests/**', 'package*.json', '.github/workflows/renderer.yml']
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'tests/**', 'package*.json', '.github/workflows/renderer.yml']
jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
        env:
          SCREENSHOT_DIR: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-screenshots
          path: test-results
